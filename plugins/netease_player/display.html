<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>网易云歌词</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    position: relative;
    width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: transparent; color: #fff;
    /* 配色方案 CSS 变量（auto 默认 = 白色高亮 + 冷蓝辉光） */
    --pc: #ffffff;
    --pcglow: rgba(120,200,255,0.55);
  }

  /* ============ DOM 歌词层（word/aria） ============ */
  .obs-stage {
    position: absolute; left: 0; top: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 10; pointer-events: none;
  }
  .lyric-slot {
    width: 100%; text-align: center;
    padding: 6px 40px; white-space: nowrap; overflow: hidden;
  }
  .lyric-slot.is-active {
    font-size: 64px; font-weight: 900; letter-spacing: 2px;
    min-height: 1em; max-width: 1400px;
    color: #fff; text-shadow: 0 2px 18px rgba(0,0,0,0.35);
    transition: all 0.55s cubic-bezier(.2,.7,.2,1);
  }
  /* 每句歌词入场：轻微上浮 + 去模糊，JS 切行时重触发。
     aria 走自己的色差入场，均不套整句动画 */
  body:not(.mode-aria) .lyric-slot.is-active.line-enter {
    animation: lineEnter 0.5s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes lineEnter {
    0%   { opacity: 0; transform: translateY(16px) scale(0.965); filter: blur(7px); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  .lyric-slot.is-active.placeholder { color: rgba(255,255,255,0.35); font-weight: 500; }
  .lyric-slot.is-active .w { display: inline-block; }

  /* ============ word 逐字入场（纯视觉，不依赖 timing） ============ */
  body.mode-word .lyric-slot.is-active {
    text-shadow: 0 2px 18px rgba(0,0,0,0.35);
  }
  body.mode-word .lyric-slot.is-active .w {
    opacity: 0; transform: translateY(8px) scale(0.9);
    animation: wordPop 0.38s cubic-bezier(.2,1.4,.3,1) forwards;
  }
  @keyframes wordPop {
    0%   { opacity: 0; transform: translateY(8px) scale(0.9); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  /* word 模式 active 字：Folia 风格 glow 脉冲 + 微放大 */
  body.mode-word .lyric-slot.is-active .w.active {
    color: #fff;
    text-shadow: 0 0 8px rgba(255,255,255,0.75), 0 0 18px rgba(255,255,255,0.45);
    animation: wordGlow 0.42s cubic-bezier(.2,.7,.2,1);
  }
  @keyframes wordGlow {
    0%   { transform: scale(1.08); }
    50%  { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  /* word 模式不走整句 lineEnter 入场（逐字错峰本身就是入场） */
  body.mode-word .lyric-slot.is-active.line-enter { animation: none; }

  .lyric-slot.is-prev, .lyric-slot.is-next {
    font-size: 33px; font-weight: 600;
    color: rgba(255,255,255,0.35);
    opacity: 0; transform: translateY(-4px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .lyric-slot.is-prev.has-text,
  .lyric-slot.is-next.has-text { opacity: 1; transform: translateY(0); }
  .lyric-slot.is-prev { order: 1; }
  .lyric-slot.is-next { order: 3; }

  /* 只显示当前一句：上/下句槽位隐藏（JS 仍更新内容，零视觉成本） */
  #slotPrev, #slotNext { display: none !important; }

  /* ============ 唯一的 Canvas 层（13 种 canvas 模式共用） ============ */
  #fx {
    position: absolute; left: 0; top: 0; right: 0; bottom: 0;
    display: none; z-index: 50; pointer-events: none;
  }
  body.use-canvas #fx { display: block; }
  body.use-canvas .obs-stage { display: none; }

  audio { display: none; }

  /* ============ 彩虹配色（DOM 模式色相流动） ============ */
  body.pal-rainbow .lyric-slot.is-active {
    animation: pcRainbow 2.4s linear infinite;
  }
  body.pal-rainbow .lyric-slot.is-active .w {
    animation: pcRainbow 2.4s linear infinite;
  }
  @keyframes pcRainbow {
    from { filter: hue-rotate(0deg); }
    to   { filter: hue-rotate(360deg); }
  }

  /* ============ Aria 色差炫光：红青双色分裂常驻整句（含未唱字），
     入场 4px→2px 收拢，结束保持 2px 色差不收回；当前字色差加重 + 白辉光 ============ */
  body.mode-aria .lyric-slot.is-active {
    text-shadow: 2px 0 0 #ff0040, -2px 0 0 #00f0ff, 0 2px 10px rgba(0,0,0,0.35);
    animation: ariaShake 0.12s ease-in-out infinite alternate;
  }
  body.mode-aria .lyric-slot.is-active.line-enter {
    animation: ariaLineIn 0.42s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes ariaLineIn {
    0%   { opacity: 0; transform: translateX(-8px); filter: blur(4px);
           text-shadow: 4px 0 0 #ff0040, -4px 0 0 #00f0ff, 0 2px 10px rgba(0,0,0,0.35); }
    55%  { opacity: 1; transform: translateX(2px);
           text-shadow: 2px 0 0 #ff0040, -2px 0 0 #00f0ff, 0 2px 10px rgba(0,0,0,0.35); }
    100% { opacity: 1; transform: translateX(0); filter: blur(0);
           text-shadow: 2px 0 0 #ff0040, -2px 0 0 #00f0ff, 0 2px 10px rgba(0,0,0,0.35); }
  }
  body.mode-aria .lyric-slot.is-active .w.active {
    color: #fff;
    text-shadow: 3px 0 0 #ff0040, -3px 0 0 #00f0ff, 0 0 14px rgba(255,255,255,0.6);
    /* aria 招牌：唱到瞬间色差撕裂到 6px 再快速收回 3px（类切换时自动重放，
       末帧与上方常态完全一致，不残留跳动） */
    animation: ariaGlitch 0.28s cubic-bezier(.3,.9,.3,1) both;
  }
  @keyframes ariaGlitch {
    0%   { text-shadow: 6px 0 0 #ff0040, -6px 0 0 #00f0ff, 0 0 20px rgba(255,255,255,0.85); }
    45%  { text-shadow: 2px 0 0 #ff0040, -2px 0 0 #00f0ff, 0 0 14px rgba(255,255,255,0.6); }
    100% { text-shadow: 3px 0 0 #ff0040, -3px 0 0 #00f0ff, 0 0 14px rgba(255,255,255,0.6); }
  }
  /* aria + 彩虹配色：glitch 管 text-shadow，rainbow 继续管 filter 色相循环（特异性更高，覆盖上面的单动画） */
  body.pal-rainbow.mode-aria .lyric-slot.is-active .w.active {
    animation: ariaGlitch 0.28s cubic-bezier(.3,.9,.3,1) both, pcRainbow 2.4s linear infinite;
  }
  @keyframes ariaShake {
    0% { transform: translateX(0); }
    100% { transform: translateX(1px); }
  }

  /* ============ 颜色主题 ============ */
  body.theme-neon .lyric-slot.is-active .w.active {
    color: #00f0ff;
    text-shadow: 0 0 8px #00f0ff, 0 0 24px #00f0ff, 0 0 48px #ff00e0;
  }
  body.theme-neon .lyric-slot.is-active { text-shadow: 0 0 18px rgba(0,240,255,0.5); }
  body.theme-neon .lyric-slot.is-prev,
  body.theme-neon .lyric-slot.is-next { color: rgba(0,240,255,0.4); }
  body.theme-gradient .lyric-slot.is-active {
    background: linear-gradient(90deg, #ff6ec7, #ffd86e, #6effd8, #6eb5ff, #c96eff, #ff6ec7);
    background-size: 400% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: flowShift 5s linear infinite;
    filter: drop-shadow(0 0 14px rgba(255,255,255,0.3));
  }
  @keyframes flowShift { 0% { background-position: 0% 50%; } 100% { background-position: 400% 50%; } }

  /* 性能探针：默认不渲染零开销，F8 开关（定位卡顿用，不属于任何效果） */
  #perf {
    display: none; position: fixed; left: 8px; top: 8px; z-index: 9999;
    pointer-events: none; font: 11px/1.55 ui-monospace, Consolas, monospace;
    background: rgba(0,0,0,0.72); color: #7cfc00; padding: 6px 9px;
    border-radius: 5px; white-space: pre; text-align: left;
  }
  #perf.on { display: block; }
</style>
</head>
<body>

<div class="obs-stage" id="obsStage">
  <div class="lyric-slot" id="slotPrev"></div>
  <div class="lyric-slot" id="slotCurr"></div>
  <div class="lyric-slot" id="slotNext"></div>
</div>

<canvas id="fx"></canvas>

<audio id="audio"></audio>

<script>
'use strict';
/* =====================================================================
 * NekoCha 适配：从 URL 解析 room_id / plugin_name（display.html 通过 HTTP URL 加载）
 * 视口尺寸：用标准 window.innerWidth/innerHeight
 * ===================================================================== */
const _parts = location.pathname.split('/').filter(Boolean);
const ROOM_ID = _parts[1] || null;
const PLUGIN_NAME = _parts[3] || null;

window.VW = window.innerWidth || 1920;
window.VH = window.innerHeight || 1080;
let VW = window.VW, VH = window.VH;

function _forceHtmlBodySize() {
  const de = document.documentElement, b = document.body;
  de.style.width = de.style.minWidth = VW + 'px';
  de.style.height = de.style.minHeight = VH + 'px';
  b.style.width = b.style.minWidth = VW + 'px';
  b.style.height = b.style.minHeight = VH + 'px';
}
_forceHtmlBodySize();
window.__onQtResize = function(w, h) {
  VW = w; VH = h; window.VW = w; window.VH = h;
  _forceHtmlBodySize();
  resizeCanvas();
  setCanvasLine(canvasIdx, true);
  if (typeof slotCurr !== 'undefined') _fitSlotFont(slotCurr);
};

/* =====================================================================
 * 全局状态
 * ===================================================================== */
const FONT = '-apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';

/* 统一字号口径：所有模式的主歌词字号都从这里取，保证歌词尺寸与窗口尺寸严格匹配。
   宽窗口按 5% 窗宽；仅在矮宽横幅窗（如 960×200）按 34% 窗高兜底，
   保证单行（含 1.4 行高）不超出窗口，常规窗口该兜底不生效。
   各模式只允许在此基础上乘固定比例系数，禁止再写死 px 或自创 VW/VH 比例。 */
function _lyricBaseFs() {
  return Math.round(Math.min(VW * 0.05, VH * 0.34));
}
/* terminal 终端矩阵字符大小：基准字号的 0.19（默认窗 12px），最小 9px 保证可读 */
function _glyphFs() {
  return Math.max(9, Math.round(_lyricBaseFs() * 0.19));
}

const DOM_MODES  = ['word', 'aria'];
const FX_MODES   = ['particle','stroke','gravity','glow','terminal','pixel','sweep','cadenza','tilt','claddagh'];
const ALL_MODES  = DOM_MODES.concat(FX_MODES);
/* 旧效果名 → 合并后效果（旧配置/已开窗口自动归一，不会失效）：
   tilt/monet → aria；scramble → word；aurora/fume/ripple → particle；
   matrix/crt → terminal；pendolo/claddagh → glow */
const MODE_ALIAS = {
  tilt: 'aria', monet: 'aria', scramble: 'word',
  aurora: 'particle', fume: 'particle', ripple: 'particle',
  matrix: 'terminal', crt: 'terminal',
  pendolo: 'glow', claddagh: 'glow',
};

let lines = [];
let domIdx = -1;       // 真实时间的当前行（DOM 显示）
let canvasIdx = -1;    // 提前 0.2s 的当前行（canvas 动画）
let currentMode = 'particle';
let currentConfig = { mode: 'particle', color: 'auto', placeholder_text: '' };

/* =====================================================================
 * 配色方案（与动效形态完全解耦，可任意组合）
 *   auto    = 每种效果保留自己的原生色
 *   其余    = 强制覆盖：粒子 / 矩阵 / 金属 / CRT / 霓虹 / DOM 高亮
 * ===================================================================== */
const PALETTES = {
  auto:    null,
  white:   { h: 0,   s: 0,   l: 100, hex: '#ffffff', glow: '#ffffff' },
  cyan:    { h: 187, s: 100, l: 55,  hex: '#00e5ff', glow: '#00f0ff' },
  pink:    { h: 318, s: 100, l: 62,  hex: '#ff3cc8', glow: '#ff3cc8' },
  gold:    { h: 45,  s: 90,  l: 62,  hex: '#ffc94d', glow: '#ffd86e' },
  purple:  { h: 275, s: 100, l: 72,  hex: '#c96eff', glow: '#c96eff' },
  green:   { h: 145, s: 100, l: 55,  hex: '#00ff78', glow: '#00ff78' },
  rainbow: { rainbow: true },
};
let currentPalette = 'auto';

/* =====================================================================
 * 粒子密度（字高切分数 divN，改采样间距，30ms 内对下一次 retarget 生效）
 * ===================================================================== */
const DENSITY_TABLE = {
  low:     { divN: 8  },   // 字高切 8 段 → 8×8 点阵感
  medium:  { divN: 12 },
  high:    { divN: 16 },
  ultra:   { divN: 22 },
  extreme: { divN: 32 },
};
let currentDensity = 'ultra';
let currentShape = 'circle';

/* =====================================================================
 * 粒子形状：一次性预渲染到离屏小贴图（实测该 QtWebEngine 分层透明窗内
 * ctx.arc 路径指令约 25µs/个——1511 个圆仅"构建路径"就 40ms，而光栅化
 * fill 仅 1ms；drawImage 贴图每帧数千次仍 <2ms，与 terminal 字符贴图同方案）。
 * 按「形状 × 半径档 × 纯色 × DPR」缓存，半径量化到 0.5px（粒子半径仅
 * 1.3~3.2，半档差异不可见），arc 代价只在首次构建贴图时支付一次。 */
const _dotSpriteCache = new Map();
function _dotRadiusLevel(r) {
  let l = Math.round(r * 2) / 2;
  if (l < 1) l = 1;
  return l;
}
function _dotSpriteShape(c, shape, R) {
  switch (shape) {
    case 'square':
      c.fillRect(-R, -R, R * 2, R * 2);
      break;
    case 'diamond':
      c.beginPath();
      c.moveTo(0, -R); c.lineTo(R, 0); c.lineTo(0, R); c.lineTo(-R, 0);
      c.closePath(); c.fill();
      break;
    case 'star4': {
      c.beginPath();
      c.moveTo(0, -R);
      for (let i = 1; i < 8; i++) {
        const ang = -Math.PI / 2 + (i * Math.PI / 4);
        const rr = (i % 2 === 0) ? R : R * 0.42;
        c.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr);
      }
      c.closePath(); c.fill();
      break;
    }
    case 'stroke':
      // 空心圆：arc 必须 closePath，否则圆环有开口缺口
      c.beginPath();
      c.arc(0, 0, R, 0, Math.PI * 2);
      c.closePath();
      c.lineWidth = 1.2; c.stroke();
      break;
    case 'circle':
    default:
      c.beginPath();
      c.arc(0, 0, R, 0, Math.PI * 2);
      c.closePath();
      c.fill();
  }
}
function _getDotSprite(shape, R, solid) {
  const dpr = window.devicePixelRatio || 1;
  const key = shape + '|' + R + '|' + dpr + '|' + solid;
  let sp = _dotSpriteCache.get(key);
  if (sp) return sp;
  if (_dotSpriteCache.size > 1024) _dotSpriteCache.clear();  // 防取色拖动产生海量色值
  const pad = shape === 'stroke' ? 2 : 1;                    // 描边外扩 0.6+抗锯齿
  const S = R * 2 + pad * 2;
  const cv = document.createElement('canvas');
  cv.width = Math.ceil(S * dpr); cv.height = Math.ceil(S * dpr);
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (shape === 'stroke') c.strokeStyle = solid; else c.fillStyle = solid;
  c.translate(S / 2, S / 2);
  _dotSpriteShape(c, shape, R);
  sp = { cv, s: S };
  _dotSpriteCache.set(key, sp);
  return sp;
}
function _applyParticleConfig() {
  // 密度档只给 divN（字号切分数），像素大小由 particle_size 配置控制
  const divN = (DENSITY_TABLE[currentDensity] || DENSITY_TABLE.ultra).divN;
  const sizeMul = currentConfig.particle_size ?? 0.75;
  for (const k of Object.keys(PARTICLE_MODES)) {
    PARTICLE_MODES[k].divN = divN;
    PARTICLE_MODES[k].sizeMul = sizeMul;
  }
  if (FX_MODES.indexOf(currentMode) >= 0) setCanvasLine(canvasIdx, true);
}

function hexToRgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

/* 自定义 hex → hsl 分量（供 hsla 桶/像素风上色）；按 hex 值缓存，改色才重算 */
let _customHsl = null, _customHslHex = '';
function _customHslColor() {
  const hex = currentConfig.custom_color || '#60a5fa';
  if (_customHslHex !== hex) {
    const n = parseInt(hex.slice(1), 16);
    const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    const l = (mx + mn) / 2, d = mx - mn;
    const s = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
    let h = 0;
    if (d) {
      if (mx === r) h = ((g - b) / d) % 6;
      else if (mx === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60; if (h < 0) h += 360;
    }
    _customHsl = { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
    _customHslHex = hex;
  }
  return _customHsl;
}

/* canvas 文字类效果统一取色：
 *   nativeHex/nativeGlow = auto 方案下该效果的原生色
 *   rainbow = 随时间流动的色相
 * 非 rainbow 结果与帧无关，按 配色+原生色 签名缓存（glow/stroke 每帧调用，旧版每帧 new 对象） */
let _palCache = null;
function _paletteColor(nativeHex, nativeGlow) {
  if (currentPalette === 'rainbow') {
    const hue = (performance.now() / 25) % 360;
    return { fill: `hsl(${hue},100%,64%)`, glow: `hsl(${hue},100%,60%)` };
  }
  // custom 分支颜色值随用户选色变化，key 必须带上 hex，否则换色后 glow 辉光仍用旧色
  const key = currentPalette + '|'
    + (currentPalette === 'custom' ? (currentConfig.custom_color || '#60a5fa') : '')
    + '|' + nativeHex + '|' + (nativeGlow || '');
  if (_palCache && _palCache.key === key) return _palCache.val;
  let val;
  if (currentPalette === 'auto') {
    val = { fill: nativeHex, glow: nativeGlow || nativeHex };
  } else if (currentPalette === 'custom') {
    // 用户选的 hex 直接用，辉光色稍微调亮一点
    const hex = currentConfig.custom_color || '#60a5fa';
    val = { fill: hex, glow: hex };
  } else {
    const pal = PALETTES[currentPalette];
    val = { fill: pal.hex, glow: pal.glow };
  }
  _palCache = { key, val };
  return val;
}

function applyPalette(name) {
  if (!PALETTES.hasOwnProperty(name) && name !== 'custom') name = 'auto';
  currentPalette = name;
  currentConfig.color = name;
  document.body.classList.toggle('pal-rainbow', name === 'rainbow');
  const pal = PALETTES[name];
  // DOM 模式用 CSS 变量着色
  if (pal && !pal.rainbow) {
    document.body.style.setProperty('--pc', pal.hex);
    document.body.style.setProperty('--pcglow', pal.glow);
  } else if (pal && pal.rainbow) {
    document.body.style.setProperty('--pc', '#ff5e5e');
    document.body.style.setProperty('--pcglow', '#5ec8ff');
  } else if (name === 'custom') {
    const hex = currentConfig.custom_color || '#60a5fa';
    document.body.style.setProperty('--pc', hex);
    document.body.style.setProperty('--pcglow', hex);
  } else {
    document.body.style.removeProperty('--pc');
    document.body.style.removeProperty('--pcglow');
  }
  // 颜色即时生效、零扰动：canvas 各绘制路径每帧实时读 currentPalette/custom_color
  //（dots 标量解析、pixel style 签名、terminal 贴图签名、stroke/glow 分支），
  // 换色不需要 retarget 粒子几何。旧版此处强制整句重采样（getImageData 同步回读 +
  // 上万粒子重排散开），拖动取色器每改一次色就掉帧、字形炸散重聚一次
}

const slotCurr = document.getElementById('slotCurr');
/* slotPrev/slotNext 已由 CSS 永久隐藏（只显示当前一句），JS 不再持有 */

/* =====================================================================
 * 配置 / 模式切换
 * ===================================================================== */
function applyMode(mode) {
  if (!mode) return currentMode;
  mode = MODE_ALIAS[mode] || mode;
  if (ALL_MODES.indexOf(mode) < 0) mode = 'particle';
  const isFX = FX_MODES.indexOf(mode) >= 0;
  ALL_MODES.forEach(m => document.body.classList.remove('mode-' + m));
  document.body.classList.add('mode-' + mode);
  document.body.classList.toggle('use-canvas', isFX);
  // 保险：强制 obs-stage/canvas 显隐（CSS 选择器依赖 body class，这里再兜底一次）
  _obsStage.style.display = isFX ? 'none' : '';
  cv.style.display = isFX ? '' : 'none';
  currentMode = mode;
  window.__lastMode = mode;
  resetModeState();
  setCanvasLine(canvasIdx, true);

/* =====================================================================
 * 歌词解析（LRC）
 * ===================================================================== */
const LINE_HEAD_RE = /^\[(\d{2}):(\d{2})\.(\d{2,3})\]/;

function parseLRC(lrcText) {
  if (!lrcText) return [];
  const result = [];
  for (const rawLine of lrcText.split('\n')) {
    const times = [];
    let pos = 0;
    const headRe = new RegExp(LINE_HEAD_RE.source);
    while (true) {
      const m = headRe.exec(rawLine.slice(pos));
      if (!m) break;
      const ms = m[3].length === 3 ? parseInt(m[3]) : parseInt(m[3]) * 10;
      times.push(parseInt(m[1]) * 60 + parseInt(m[2]) + ms / 1000);
      pos += m[0].length; headRe.lastIndex = 0;
    }
    if (!times.length) continue;
    const text = rawLine.slice(pos).trim();
    if (!text || text.startsWith('[by:')) continue;
    for (const t of times) result.push({start: t, text, words: [{text, start: t, end: t}]});
  }
  result.sort((a, b) => a.start - b.start);
  for (let i = 0; i < result.length; i++) {
    const line = result[i];
    line.end = i + 1 < result.length ? result[i+1].start : line.start + 3;
    // stroke 按字符切 word：每个字均分该行时长（YRC 删掉后无逐字时间戳，均分是唯一方案）
    const chars = [...line.text];
    const dur = line.end - line.start;
    const per = dur / Math.max(chars.length, 1);
    line.words = chars.map((c, j) => ({
      text: c,
      start: line.start + j * per,
      end: line.start + (j + 1) * per,
    }));
  }
  return result;
}

function esc(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function _domWordTick(t) {
  const line = slotCurr._lineRef;

  const children = slotCurr.children;
  let activeIdx = -1;
  for (let i = 0; i < line.words.length && i < children.length; i++) {

function _fitSingleLineFont(c2d, text, baseFs, weight) {

  }

    // 播放→未播放的边沿：粒子目标从最后一句歌词重设为占位句（retarget 一次即可）
    if (tick._wasPlaying && canvasIdx !== -1) setCanvasLine(-1, true);
    if (domIdx !== -1) {
      // DOM 层始终回到占位句
      domIdx = -2;
      updateDomLine(-1);
    }
  }
  tick._wasPlaying = playing;

  // 渲染
  const _rf0 = performance.now();
  if (FX_MODES.indexOf(currentMode) >= 0) {
    ctx.clearRect(0, 0, VW, VH);
    // 统一行切换包络：本帧整体亮度；到不可见点时在此完成换字（先于物理/绘制）
    ctx.globalAlpha = _lineEnvTick(performance.now());
    const idle = !playing;
    switch (currentMode) {
      case 'particle':
      case 'gravity':
      case 'terminal':
      case 'pixel':
        particleModeFrame(currentMode, playing ? t : 0, true, idle);
        break;
      case 'stroke':  playing ? strokeFrame(t) : drawPlaceholder(); break;
      case 'glow':    playing ? glowFrame() : drawPlaceholder(); break;
      case 'sweep':   playing ? sweepFrame(t) : drawPlaceholder(); break;
      case 'cadenza': playing ? cadenzaFrame(t) : drawPlaceholder(); break;
      case 'tilt':    playing ? tiltFrame(t) : drawPlaceholder(); break;
      case 'claddagh':playing ? claddaghFrame(t) : drawPlaceholder(); break;
    }
    ctx.globalAlpha = 1;
  }
  const _rfMs = performance.now() - _rf0;
  _lastFrameTs = performance.now();
  _pfSample(_rfMs);
  _scheduleRaf();
}

/* rAF 单飞调度 + 定时器心跳兜底：
   伪最小化时窗口探到屏幕外（仅几像素露边），Chromium 可能暂停 rAF——
   纯 rAF 驱动会让歌词/粒子彻底冻结。独立 setInterval（配合
   --disable-background-timer-throttling）在 rAF 停摆超过 120ms 时直接驱动 tick，
   窗口回屏后 rAF 恢复，心跳发现帧新鲜便自动让出，不重复绘制。 */
let _lastFrameTs = 0;
let _rafPending = false;
function _scheduleRaf() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(function () { _rafPending = false; tick(); });
}
setInterval(function () {
  if (performance.now() - _lastFrameTs > 120) tick();
}, 80);
/* 启动引导：currentConfig 由 Python 在 setHtml 时注入（效果/配色/密度/形状/占位文字），
 * tick 开跑前先应用，保证窗口第一帧就是配置里的风格，而不是硬编码默认值再异步跳变 */
(function applyBootConfig() {
  currentConfig.mode = applyMode(MODE_ALIAS[currentConfig.mode] || currentConfig.mode);
  applyPalette(currentConfig.color || 'auto');
  currentDensity = DENSITY_TABLE[currentConfig.particle_density]
    ? currentConfig.particle_density : 'ultra';
  currentShape = currentConfig.particle_shape || 'circle';
  _applyParticleConfig();
  // DOM 模式 tick 不播放时不更新行，首帧占位也要用配置值（domIdx 初值为 -1，需先破守卫）
  domIdx = -2;
  updateDomLine(-1);
})();

_scheduleRaf();

/* =====================================================================
 * SSE + 播放入口
 * ===================================================================== */
const evt = new EventSource('/api/events' + (ROOM_ID && PLUGIN_NAME ? '?plugin=' + PLUGIN_NAME + '&room_id=' + ROOM_ID : ''));
evt.onmessage = (e) => {
  try {
    const msg = JSON.parse(e.data);
    if (!msg) return;
    if (msg.cmd === 'netease_play') loadSong(msg.data);
    if (msg.cmd === 'config_changed') refreshConfig();
  } catch (err) {}
};

function loadSong(data) {
  lines = parseLRC(data.lrc || '');
  domIdx = -2; canvasIdx = -2;   // 强制下帧重绘占位
  updateDomLine(-1);
  resetModeState();
  setCanvasLine(-1, true);

  audioEl.pause(); audioEl.src = data.url;
  audioEl.play().then(() => {
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: data.name || '未知', artist: data.artist || '',
      });
      navigator.mediaSession.playbackState = 'playing';
      navigator.mediaSession.setActionHandler('play', () => audioEl.play());
      navigator.mediaSession.setActionHandler('pause', () => audioEl.pause());
      navigator.mediaSession.setActionHandler('seekto',
        (e) => { if (e.fastSeek) audioEl.fastSeek(e.seekTime); else audioEl.currentTime = e.seekTime; });
    }
  }).catch(() => {
    // Chromium 自动播放策略兜底
    audioEl.muted = true;
    audioEl.play().then(() => { audioEl.muted = false; }).catch(() => {});
  });
}
</script>
</body>
