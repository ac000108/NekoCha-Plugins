<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>点歌队列</title>
    <style>
        @font-face {
            font-family: 'Yozai';
            src: url('/static/fonts/yozai.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            background: transparent;
            font-family: 'Yozai', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            pointer-events: none;
        }

        /* ============ Toast ============ */
        .toast-wrap {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
            z-index: 100;
        }
        .toast {
            opacity: 0;
            transform: translateY(30px) scale(0.92);
            transition: opacity 0.5s ease-out,
                        transform 0.5s cubic-bezier(.34,1.56,.64,1);
        }
        .toast.show { opacity: 1; transform: translateY(0) scale(1); }
        .toast.hide { opacity: 0; transform: translateY(20px) scale(0.96); transition-duration: 0.4s; }

        .toast-card {
            position: relative;
            width: 380px;
            padding: 22px 28px 20px;
            background: linear-gradient(135deg,
                rgba(255, 235, 245, 0.96) 0%,
                rgba(255, 225, 240, 0.94) 40%,
                rgba(255, 218, 236, 0.92) 100%);
            backdrop-filter: blur(18px);
            border-radius: 22px;
            border: 1.5px solid rgba(255, 182, 213, 0.7);
            box-shadow:
                0 8px 32px rgba(255, 130, 180, 0.25),
                0 2px 8px rgba(255, 130, 180, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            overflow: hidden;
        }
        .toast-card::before {
            content: '';
            position: absolute;
            top: -40px; right: -40px;
            width: 120px; height: 120px;
            background: radial-gradient(circle, rgba(255, 182, 213, 0.6) 0%, transparent 70%);
            border-radius: 50%;
        }
        .toast-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .toast-icon { font-size: 22px; line-height: 1; }
        .toast-label { font-size: 15px; color: #c2185b; font-weight: 500; letter-spacing: 1px; }
        .toast-user {
            font-size: 15px; color: #880e4f; font-weight: 600;
            max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .toast-song {
            font-size: 32px; font-weight: 700; color: #6a1b4a; text-align: center;
            padding: 14px 0 12px; line-height: 1.2; letter-spacing: 2px;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
        }
        .toast-trigger { text-align: center; font-size: 13px; color: #ad1457; opacity: 0.7; }

        /* ============ Queue ============ */
        .queue {
            position: fixed;
            left: 20px; bottom: 20px;
            width: 260px;
            z-index: 50; display: flex; flex-direction: column;
            pointer-events: auto;
        }
        .queue-card {
            background: linear-gradient(160deg,
                rgba(255, 240, 247, 0.92) 0%,
                rgba(255, 232, 243, 0.90) 100%);
            backdrop-filter: blur(16px);
            border-radius: 18px;
            border: 1.5px solid rgba(255, 192, 219, 0.6);
            box-shadow:
                0 6px 24px rgba(255, 130, 180, 0.18),
                0 2px 6px rgba(255, 130, 180, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.7);
            overflow: hidden;
        }
        .queue-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px 10px;
            border-bottom: 1px solid rgba(255, 192, 219, 0.4);
        }
        .queue-title {
            font-size: 17px; font-weight: 700; color: #880e4f; letter-spacing: 1px;
            display: flex; align-items: center; gap: 6px;
        }
        .queue-count {
            font-size: 13px; color: #c2185b;
            background: rgba(255, 182, 213, 0.4);
            padding: 1px 8px; border-radius: 10px; font-weight: 500;
        }
        .queue-list {
            padding: 4px 0;
            max-height: 140px; overflow: hidden;
        }
        .queue-list::-webkit-scrollbar { width: 4px; }
        .queue-list::-webkit-scrollbar-thumb { background: rgba(255, 150, 190, 0.4); border-radius: 2px; }

        .queue-item {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 16px;
            opacity: 0; transform: translateX(-12px) scale(0.97);
            transition: opacity 0.45s ease, transform 0.45s cubic-bezier(.34,1.56,.64,1);
        }
        .queue-item.show { opacity: 1; transform: translateX(0) scale(1); }
        .queue-item.fade-out {
            opacity: 0 !important; transform: translateX(30px) scale(0.92) !important;
            transition: opacity 0.4s ease, transform 0.4s ease !important;
        }

        /* 当前唱的 —— 呼吸光晕 */
        .queue-item.current .q-num {
            background: linear-gradient(135deg, #ff6b9d, #ff8fb1);
            color: #fff;
            animation: breathe 2.2s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 107, 157, 0.5); transform: scale(1); }
            50%      { box-shadow: 0 0 0 6px rgba(255, 107, 157, 0); transform: scale(1.08); }
        }

        .q-num {
            width: 22px; height: 22px;
            font-size: 12px; font-weight: 600; color: #c2185b;
            background: rgba(255, 182, 213, 0.5);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .queue-item.current .q-num {
            background: linear-gradient(135deg, #ff6b9d, #ff8fb1); color: #fff;
        }

        .q-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .q-song {
            font-size: 15px; font-weight: 600; color: #6a1b4a;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .q-user {
            font-size: 12px; color: #ad1457; opacity: 0.65;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .queue-empty { text-align: center; padding: 24px 16px; font-size: 14px; color: #ad1457; opacity: 0.55; }
    </style>
</head>
<body>

    <div class="toast-wrap" id="toastWrap"></div>

    <div class="queue">
        <div class="queue-card">
            <div class="queue-header">
                <span class="queue-title">🎵 点歌队列</span>
                <span class="queue-count" id="queueCount">0 首</span>
            </div>
            <div class="queue-list" id="queueList">
                <div class="queue-empty" id="queueEmpty">等待观众点歌~ 🎶</div>
            </div>
        </div>
    </div>

    <script>
        const _parts = window.location.pathname.split('/').filter(Boolean);
        const ROOM_ID = _parts[1] || null;
        const PLUGIN_NAME = _parts[3] || null;

        const POLL = 1500;
        const TOAST_DURATION = 4000;

        let queue = [];
        let knownIds = new Set();
        let fadingIds = new Set();

        const $list = document.getElementById('queueList');
        const $count = document.getElementById('queueCount');
        const $empty = document.getElementById('queueEmpty');
        const $toastWrap = document.getElementById('toastWrap');

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        async function fetchState() {
            if (!ROOM_ID || !PLUGIN_NAME) return null;
            try {
                const r = await fetch(`/api/plugins/${ROOM_ID}/${PLUGIN_NAME}/state`);
                const data = await r.json();
                if (data.success) return data.state;
            } catch (e) {}
            return null;
        }

        async function saveQueue(newQueue) {
            if (!ROOM_ID || !PLUGIN_NAME) return;
            try {
                await fetch(`/api/plugins/${ROOM_ID}/${PLUGIN_NAME}/state`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: 'queue', value: newQueue })
                });
            } catch (e) {}
        }

        // ==================== Toast ====================

        function showToast(item) {
            if (knownIds.has(item.id)) return;
            knownIds.add(item.id);
            const el = document.createElement('div');
            el.className = 'toast';
            const triggerMap = { '主播': '', '盲盒': '盲盒续杯', '免费': '免费次数' };
            const triggerText = triggerMap[item.trigger] || '';
            el.innerHTML = `
                <div class="toast-card">
                    <div class="toast-top">
                        <span class="toast-icon">🎵</span>
                        <span class="toast-user">${esc(item.user)}</span>
                        <span class="toast-label">点了一首</span>
                    </div>
                    <div class="toast-song">${esc(item.song)}</div>
                    ${triggerText ? `<div class="toast-trigger">${triggerText}</div>` : ''}
                </div>`;
            $toastWrap.appendChild(el);
            requestAnimationFrame(() => el.classList.add('show'));
            setTimeout(() => {
                el.classList.remove('show');
                el.classList.add('hide');
                setTimeout(() => el.remove(), 500);
            }, TOAST_DURATION);
        }

        // ==================== Render ====================

        function renderQueue() {
            const removedSet = new Set(removedIds);

            // fading 的条目即使已被 removedIds 标记，也要渲染出来（为了动画）
            const MAX_VISIBLE = 3;
            const visible = queue.filter(q => {
                if (removedSet.has(q.id) && !fadingIds.has(q.id)) return false;
                return true;
            }).slice(0, MAX_VISIBLE);

            // fade-out 时也要把它算"当前项"的位置
            const fadeIdx = visible.findIndex(q => fadingIds.has(q.id));
            // 被 shift 掉的那条后面的项，在 fade-out 时数字不应该跳

            $count.textContent = (queue.filter(q => !removedSet.has(q.id)).length) + ' 首';

            if (visible.length === 0) {
                $list.innerHTML = '';
                $list.appendChild($empty);
                return;
            }

            const firstRender = $list.children.length === 0 || $empty.parentNode;

            // 计算每个项目的"展示编号"（fade-out 项不占编号）
            let displayIdx = -1;
            $list.innerHTML = visible.map((item) => {
                const fading = fadingIds.has(item.id);
                if (!fading) displayIdx++;
                const isFirst = !fading && displayIdx === 0;
                const num = isFirst ? '▶' : (fading ? '' : displayIdx);
                const cls = ['queue-item'];
                if (isFirst) cls.push('current');
                if (fading) cls.push('fade-out');
                return `
                <div class="${cls.join(' ')}" data-id="${item.id}">
                    <div class="q-num">${num}</div>
                    <div class="q-info">
                        <div class="q-song">${esc(item.song)}</div>
                        <div class="q-user">by ${esc(item.user)}</div>
                    </div>
                </div>`;
            }).join('');

            const items = $list.querySelectorAll('.queue-item');
            items.forEach((el, i) => {
                if (el.classList.contains('show') || el.classList.contains('fade-out')) return;
                setTimeout(() => el.classList.add('show'),
                    firstRender ? i * 60 : 0);
            });
        }

        // ==================== 控制 ====================

        const FADE_MS = 400;
        let removedIds = [];
        let lastRemoteQueue = [];  // 缓存 poll 拉到的完整队列，供 undo 即时恢复

        async function doNext() {
            if (queue.length === 0) return;
            const removed = queue[0];
            fadingIds.add(removed.id);
            renderQueue();
            // 动画结束后真正删除
            setTimeout(async () => {
                fadingIds.delete(removed.id);
                queue.shift();
                removedIds.push(removed.id);
                knownIds.add(removed.id);   // 防止 undo 时 toast
                renderQueue();
                await _saveAll();
            }, FADE_MS);
        }

        async function doUndo() {
            if (removedIds.length === 0) return;
            const id = removedIds.pop();
            // 从缓存里找回来，即时恢复
            const restored = lastRemoteQueue.find(q => q.id === id);
            if (restored && !queue.some(q => q.id === id)) {
                queue.unshift(restored);
            }
            knownIds.add(id);  // 防止 toast（这条本来就应该在 knownIds 里）
            renderQueue();
            await _saveAll();
        }

        async function _saveAll() {
            if (!ROOM_ID || !PLUGIN_NAME) return;
            try {
                await fetch(`/api/plugins/${ROOM_ID}/${PLUGIN_NAME}/state`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        key: 'queue_view',
                        value: removedIds
                    })
                });
            } catch (e) {}
        }

        // ==================== 轮询 ====================

        async function poll() {
            try {
                const state = await fetchState();
                if (!state) return;

                // 插件的 queue（纯数组）
                const remoteQueue = Array.isArray(state.queue) ? state.queue : [];
                lastRemoteQueue = remoteQueue;  // 缓存供 undo 用
                // 前端的 queue_view（removedIds 数组）
                const remoteRemoved = Array.isArray(state.queue_view) ? state.queue_view : [];

                const remoteIds = new Set(remoteQueue.map(q => q.id));
                const myRemoved = new Set(removedIds);

                // 1. 插件新加的 → 追加（除非已被前端标记删除）
                let changed = false;
                const myVisibleIds = new Set(queue.map(q => q.id));
                for (const item of remoteQueue) {
                    if (!myVisibleIds.has(item.id) && !myRemoved.has(item.id)) {
                        queue.push(item);
                        changed = true;
                    }
                }

                // 2. 插件砍了的（超过50条）→ 同步移除
                const beforeLen = queue.length;
                queue = queue.filter(q => remoteIds.has(q.id));
                if (queue.length !== beforeLen) changed = true;

                // 3. 同步 removedIds（remote 是持久化的，本地刚删的也得合进去）
                removedIds = [...new Set([...remoteRemoved, ...removedIds])];

                // 4. Toast（只 toast 没被删的）
                const removedSet = new Set(removedIds);
                for (const item of remoteQueue) {
                    if (!removedSet.has(item.id) && !knownIds.has(item.id)) {
                        showToast(item);
                    }
                }
                knownIds = new Set(remoteQueue.filter(q => !removedSet.has(q.id)).map(q => q.id));

                // 5. 合并后的显示队列 = remoteQueue 过滤 removedIds
                // 但 queue 保持包含全部（用于 shift 时不丢数据）
                // renderQueue 内部再过滤

                if (changed) renderQueue();
            } catch (e) {
                console.error('[点歌队列] 轮询失败:', e);
            }
        }

        async function init() {
            if (!ROOM_ID) {
                $empty.textContent = '错误: 缺少房间ID';
                return;
            }
            if (!PLUGIN_NAME) {
                $empty.textContent = '错误: 缺少插件名';
                return;
            }

            // 初始化
            const state = await fetchState();
            const remoteQueue = (state && Array.isArray(state.queue)) ? state.queue : [];
            const remoteRemoved = (state && Array.isArray(state.queue_view)) ? state.queue_view : [];

            removedIds = [...remoteRemoved];
            const removedSet = new Set(removedIds);
            queue = remoteQueue.filter(q => !removedSet.has(q.id));
            knownIds = new Set(queue.map(q => q.id));
            renderQueue();

            // 快捷键
            document.addEventListener('keydown', e => {
                const tag = (e.target && e.target.tagName || '').toLowerCase();
                if (tag === 'input' || tag === 'textarea') return;
                if (e.key === ']' && !e.ctrlKey) { e.preventDefault(); doNext(); }
                else if (e.key === '[' && !e.ctrlKey) { e.preventDefault(); doUndo(); }
            });

            setInterval(poll, POLL);
        }

        init();
    </script>
</body>
</html>
