<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>点歌队列</title>
    <style>
        @font-face {
            font-family: 'Yozai';
            src: url('/static/fonts/yozai.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            background: transparent;
            font-family: 'Yozai', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            pointer-events: none;
        }

        /* ============ Toast ============ */
        .toast-wrap {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
            z-index: 100;
        }
        .toast {
            opacity: 0;
            transform: translateY(30px) scale(0.9);
            transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .toast.show { opacity: 1; transform: translateY(0) scale(1); }
        .toast.hide { opacity: 0; transform: translateY(-10px) scale(0.95); }

        .toast-card {
            position: relative;
            width: 380px;
            padding: 22px 28px 20px;
            background: linear-gradient(135deg,
                rgba(255, 235, 245, 0.96) 0%,
                rgba(255, 225, 240, 0.94) 40%,
                rgba(255, 218, 236, 0.92) 100%);
            backdrop-filter: blur(18px);
            border-radius: 22px;
            border: 1.5px solid rgba(255, 182, 213, 0.7);
            box-shadow:
                0 8px 32px rgba(255, 130, 180, 0.25),
                0 2px 8px rgba(255, 130, 180, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            overflow: hidden;
        }
        .toast-card::before {
            content: '';
            position: absolute;
            top: -40px; right: -40px;
            width: 120px; height: 120px;
            background: radial-gradient(circle, rgba(255, 182, 213, 0.6) 0%, transparent 70%);
            border-radius: 50%;
        }
        .toast-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .toast-icon { font-size: 22px; line-height: 1; }
        .toast-label { font-size: 15px; color: #c2185b; font-weight: 500; letter-spacing: 1px; }
        .toast-user {
            font-size: 15px; color: #880e4f; font-weight: 600;
            max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .toast-song {
            font-size: 32px; font-weight: 700; color: #6a1b4a; text-align: center;
            padding: 14px 0 12px; line-height: 1.2; letter-spacing: 2px;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
        }
        .toast-trigger { text-align: center; font-size: 13px; color: #ad1457; opacity: 0.7; }

        /* ============ Queue ============ */
        .queue {
            position: fixed;
            left: 20px; bottom: 20px;
            width: 260px; max-height: 420px;
            z-index: 50; display: flex; flex-direction: column;
            pointer-events: auto;
        }
        .queue-card {
            background: linear-gradient(160deg,
                rgba(255, 240, 247, 0.92) 0%,
                rgba(255, 232, 243, 0.90) 100%);
            backdrop-filter: blur(16px);
            border-radius: 18px;
            border: 1.5px solid rgba(255, 192, 219, 0.6);
            box-shadow:
                0 6px 24px rgba(255, 130, 180, 0.18),
                0 2px 6px rgba(255, 130, 180, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.7);
            overflow: hidden;
        }
        .queue-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px 10px;
            border-bottom: 1px solid rgba(255, 192, 219, 0.4);
        }
        .queue-title {
            font-size: 17px; font-weight: 700; color: #880e4f; letter-spacing: 1px;
            display: flex; align-items: center; gap: 6px;
        }
        .queue-count {
            font-size: 13px; color: #c2185b;
            background: rgba(255, 182, 213, 0.4);
            padding: 1px 8px; border-radius: 10px; font-weight: 500;
        }
        .queue-list {
            padding: 6px 0;
            max-height: 360px; overflow-y: auto;
        }
        .queue-list::-webkit-scrollbar { width: 4px; }
        .queue-list::-webkit-scrollbar-thumb { background: rgba(255, 150, 190, 0.4); border-radius: 2px; }

        .queue-item {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 16px;
            opacity: 0; transform: translateX(-12px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .queue-item.show { opacity: 1; transform: translateX(0); }
        .queue-item.fade-out {
            opacity: 0 !important; transform: translateX(40px) !important;
            max-height: 0 !important; padding-top: 0 !important; padding-bottom: 0 !important;
            margin: 0 !important; overflow: hidden !important; pointer-events: none !important;
            transition: opacity 0.35s ease, transform 0.35s ease, max-height 0.35s ease, padding 0.35s ease !important;
        }

        .q-num {
            width: 22px; height: 22px;
            font-size: 12px; font-weight: 600; color: #c2185b;
            background: rgba(255, 182, 213, 0.5);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .queue-item.current .q-num {
            background: linear-gradient(135deg, #ff6b9d, #ff8fb1); color: #fff;
        }
        .queue-item.done .q-song { text-decoration: line-through; color: #b08aa0; opacity: 0.55; }
        .queue-item.done .q-user { opacity: 0.35; }
        .queue-item.done .q-num { background: #d4c0cc; color: #8e7080; font-size: 11px; }

        .q-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .q-song {
            font-size: 15px; font-weight: 600; color: #6a1b4a;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .q-user {
            font-size: 12px; color: #ad1457; opacity: 0.65;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .queue-empty { text-align: center; padding: 24px 16px; font-size: 14px; color: #ad1457; opacity: 0.55; }
    </style>
</head>
<body>

    <div class="toast-wrap" id="toastWrap"></div>

    <div class="queue">
        <div class="queue-card">
            <div class="queue-header">
                <span class="queue-title">🎵 点歌队列</span>
                <span class="queue-count" id="queueCount">0 首</span>
            </div>
            <div class="queue-list" id="queueList">
                <div class="queue-empty" id="queueEmpty">等待观众点歌~ 🎶</div>
            </div>
        </div>
    </div>

    <script>
        const _parts = window.location.pathname.split('/').filter(Boolean);
        const ROOM_ID = _parts[1] || null;
        const PLUGIN_NAME = _parts[3] || null;

        const POLL = 1500;
        const TOAST_DURATION = 4000;

        let queue = [];
        let knownIds = new Set();
        let fadingIds = new Set();

        const $list = document.getElementById('queueList');
        const $count = document.getElementById('queueCount');
        const $empty = document.getElementById('queueEmpty');
        const $toastWrap = document.getElementById('toastWrap');

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        async function fetchState() {
            if (!ROOM_ID || !PLUGIN_NAME) return null;
            try {
                const r = await fetch(`/api/plugins/${ROOM_ID}/${PLUGIN_NAME}/state`);
                const data = await r.json();
                if (data.success) return data.state;
            } catch (e) {}
            return null;
        }

        async function saveQueue(newQueue) {
            if (!ROOM_ID || !PLUGIN_NAME) return;
            try {
                await fetch(`/api/plugins/${ROOM_ID}/${PLUGIN_NAME}/state`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: 'queue', value: newQueue })
                });
            } catch (e) {}
        }

        // ==================== Toast ====================

        function showToast(item) {
            if (knownIds.has(item.id)) return;
            knownIds.add(item.id);
            const el = document.createElement('div');
            el.className = 'toast';
            const triggerMap = { '主播': '', '盲盒': '盲盒续杯', '免费': '免费次数' };
            const triggerText = triggerMap[item.trigger] || '';
            el.innerHTML = `
                <div class="toast-card">
                    <div class="toast-top">
                        <span class="toast-icon">🎵</span>
                        <span class="toast-user">${esc(item.user)}</span>
                        <span class="toast-label">点了一首</span>
                    </div>
                    <div class="toast-song">${esc(item.song)}</div>
                    ${triggerText ? `<div class="toast-trigger">${triggerText}</div>` : ''}
                </div>`;
            $toastWrap.appendChild(el);
            requestAnimationFrame(() => el.classList.add('show'));
            setTimeout(() => {
                el.classList.remove('show');
                el.classList.add('hide');
                setTimeout(() => el.remove(), 500);
            }, TOAST_DURATION);
        }

        // ==================== Render ====================

        function renderQueue() {
            // 统计未唱数量
            const pending = queue.filter(q => !q.done);
            $count.textContent = pending.length + ' 首';

            if (queue.length === 0) {
                $list.innerHTML = '';
                $list.appendChild($empty);
                return;
            }

            const firstRender = $list.children.length === 0 || $empty.parentNode;

            $list.innerHTML = queue.map((item, i) => {
                const done = !!item.done;
                const fading = fadingIds.has(item.id);
                const pendingBefore = queue.slice(0, i).filter(q => !q.done).length;
                let num;
                if (done) num = '✓';
                else if (pendingBefore === 0) num = '▶';    // 第一个未唱
                else num = pendingBefore;                   // 第几个待唱
                const cls = ['queue-item'];
                if (done) cls.push('done');
                else if (pendingBefore === 0) cls.push('current');
                if (fading) cls.push('fade-out');
                return `
                <div class="${cls.join(' ')}" data-id="${item.id}">
                    <div class="q-num">${num}</div>
                    <div class="q-info">
                        <div class="q-song">${esc(item.song)}</div>
                        <div class="q-user">by ${esc(item.user)}</div>
                    </div>
                </div>`;
            }).join('');

            const items = $list.querySelectorAll('.queue-item');
            items.forEach((el, i) => {
                if (el.classList.contains('show')) return;
                setTimeout(() => el.classList.add('show'),
                    firstRender ? i * 60 : i * 40);
            });
        }

        // ==================== 控制 ====================

        const FADE_MS = 350;

        async function doNext() {
            const idx = queue.findIndex(q => !q.done);
            if (idx === -1) return;
            fadingIds.add(queue[idx].id);
            renderQueue();
            setTimeout(async () => {
                queue[idx].done = true;
                fadingIds.clear();
                renderQueue();
                await saveQueue(queue);
            }, FADE_MS);
        }

        async function doUndo() {
            // 把最后一个 done=true 的改回 false
            const idx = queue.length - 1 - [...queue].reverse().findIndex(q => q.done);
            if (idx < 0) return;
            queue[idx].done = false;
            renderQueue();
            await saveQueue(queue);
        }

        async function doReset() {
            fadingIds.clear();
            queue = queue.map(q => ({ ...q, done: false }));
            renderQueue();
            await saveQueue(queue);
        }

        // ==================== 轮询 ====================

        async function poll() {
            try {
                const state = await fetchState();
                if (!state || !Array.isArray(state.queue)) return;

                // 检测新增条目 → 弹 toast
                for (const item of state.queue) {
                    if (!knownIds.has(item.id)) {
                        showToast(item);
                    }
                }
                knownIds = new Set(state.queue.map(q => q.id));

                // 检查本地是否有未保存的改动（控制面板可能改了但 poll 被后端覆盖）
                // 这里简单处理：以后端为准，因为插件也可能在同一时间追加
                const myDone = queue.filter(q => q.done).map(q => q.id).sort().join(',');
                const remoteDone = state.queue.filter(q => q.done).map(q => q.id).sort().join(',');
                if (myDone !== remoteDone || queue.length !== state.queue.length) {
                    queue = state.queue;
                    renderQueue();
                }
            } catch (e) {
                console.error('[点歌队列] 轮询失败:', e);
            }
        }

        async function init() {
            if (!ROOM_ID) {
                $empty.textContent = '错误: 缺少房间ID';
                return;
            }
            if (!PLUGIN_NAME) {
                $empty.textContent = '错误: 缺少插件名';
                return;
            }

            // 初始化：读一次 state
            const state = await fetchState();
            if (state && Array.isArray(state.queue)) {
                queue = state.queue;
                knownIds = new Set(queue.map(q => q.id));
                renderQueue();
            }

            // 快捷键（OBS 交互窗口或独立浏览器窗口聚焦时可用）
            document.addEventListener('keydown', e => {
                const tag = (e.target && e.target.tagName || '').toLowerCase();
                if (tag === 'input' || tag === 'textarea') return;
                if (e.key === ']' && !e.ctrlKey) { e.preventDefault(); doNext(); }
                else if (e.key === '[' && !e.ctrlKey) { e.preventDefault(); doUndo(); }
                else if (e.shiftKey && (e.key === 'X' || e.key === 'x')) { e.preventDefault(); doReset(); }
            });

            setInterval(poll, POLL);
        }

        init();
    </script>
</body>
</html>
