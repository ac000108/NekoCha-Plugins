<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>点歌队列</title>
    <style>
        @font-face {
            font-family: 'Yozai';
            src: url('/static/fonts/yozai.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            background: transparent;
            font-family: 'Yozai', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            pointer-events: none;
        }

        /* ============ Toast ============ */
        .toast-wrap {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
            z-index: 100;
        }
        .toast {
            opacity: 0;
            transform: translateY(30px) scale(0.92);
            transition: opacity 0.5s ease-out,
                        transform 0.5s cubic-bezier(.34,1.56,.64,1);
        }
        .toast.show { opacity: 1; transform: translateY(0) scale(1); }
        .toast.hide { opacity: 0; transform: translateY(20px) scale(0.96); transition-duration: 0.4s; }

        .toast-card {
            position: relative;
            width: 380px;
            padding: 22px 28px 20px;
            background: linear-gradient(135deg,
                rgba(255, 235, 245, 0.96) 0%,
                rgba(255, 225, 240, 0.94) 40%,
                rgba(255, 218, 236, 0.92) 100%);
            border-radius: 22px;
            border: 1.5px solid rgba(255, 182, 213, 0.7);
            box-shadow:
                0 8px 32px rgba(255, 130, 180, 0.25),
                0 2px 8px rgba(255, 130, 180, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            overflow: hidden;
        }
        .toast-card::before {
            content: '';
            position: absolute;
            top: -40px; right: -40px;
            width: 120px; height: 120px;
            background: radial-gradient(circle, rgba(255, 182, 213, 0.6) 0%, transparent 70%);
            border-radius: 50%;
        }
        .toast-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .toast-icon { font-size: 22px; line-height: 1; }
        .toast-label { font-size: 15px; color: #c2185b; font-weight: 500; letter-spacing: 1px; }
        .toast-user {
            font-size: 15px; color: #880e4f; font-weight: 600;
            max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .toast-song {
            font-size: 32px; font-weight: 700; color: #6a1b4a; text-align: center;
            padding: 14px 0 12px; line-height: 1.2; letter-spacing: 2px;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
        }
        .toast-trigger { text-align: center; font-size: 13px; color: #ad1457; opacity: 0.7; }

        /* ============ Queue ============ */
        .queue {
            position: fixed;
            left: 20px; top: 180px;
            width: 220px;
            z-index: 50;
            pointer-events: auto;
        }

        /* 绝对定位容器，固定能装 4 条（3 条 + 1 条 fade-out 预加载） */
        .queue-list {
            position: relative;
            height: 178px;  /* 4 × 40px + 3 × 6px gap */
            overflow: hidden;
        }

        /* 每条绝对定位，top 由 JS 控制并过渡 */
        .queue-item {
            position: absolute;
            left: 0; right: 0;
            height: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            background: rgba(255, 240, 248, 0.75);
            border-radius: 12px;
            opacity: 0;
            transform: translateX(20px) scale(0.95);
            transition:
                top 0.35s ease,
                opacity 0.35s ease,
                transform 0.35s ease;
        }
        .queue-item.show {
            opacity: 1;
            transform: translateX(0) scale(1);
        }
        .queue-item.fade-out {
            opacity: 0;
            transform: translateX(20px) scale(0.95);
            pointer-events: none;
        }

        .q-num {
            width: 18px; height: 18px;
            font-size: 11px; font-weight: 700; color: #fff;
            background: #e891af;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .queue-item.current .q-num {
            background: #ff4d8b;
            animation: breathe 2.2s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,77,139,0.5); }
            50%      { box-shadow: 0 0 0 5px rgba(255,77,139,0); }
        }

        .q-song {
            flex: 1; min-width: 0;
            font-size: 14px; font-weight: 600; color: #3d1027;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            text-shadow: 0 1px 0 rgba(255,255,255,0.6);
        }
        .q-user {
            font-size: 11px; color: #7a2a4a; opacity: 0.75;
            flex-shrink: 0;
        }
        .queue-empty {
            position: absolute;
            top: 0; left: 0; right: 0;
            text-align: center; padding: 8px 10px;
            font-size: 13px; color: #c2185b; opacity: 0.7;
            background: rgba(255,255,255,0.45); border-radius: 10px;
        }
        .queue-more {
            position: absolute;
            left: 0; right: 0;
            top: 178px;  /* 紧贴 queue-list 底部 */
            text-align: center;
            font-size: 11px; color: #ad1457; opacity: 0.55;
            padding: 2px 0;
        }
    </style>
</head>
<body>

    <div class="toast-wrap" id="toastWrap"></div>

    <div class="queue">
        <div class="queue-list" id="queueList">
            <div class="queue-empty" id="queueEmpty">等待点歌~ 🎶</div>
        </div>
        <div class="queue-more" id="queueMore" style="display:none"></div>
    </div>

    <script>
        const _parts = window.location.pathname.split('/').filter(Boolean);
        const ROOM_ID = _parts[1] || null;
        const PLUGIN_NAME = _parts[3] || null;

        const POLL = 1500;
        const TOAST_DURATION = 4000;
        const ROW_H = 40;
        const GAP = 6;
        const ROW_STEP = ROW_H + GAP;  // 46px

        let queue = [];
        let knownIds = new Set();
        let fadingIds = new Set();

        const $list = document.getElementById('queueList');
        const $empty = document.getElementById('queueEmpty');
        const $more = document.getElementById('queueMore');
        const $toastWrap = document.getElementById('toastWrap');

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        async function fetchState() {
            if (!ROOM_ID || !PLUGIN_NAME) return null;
            try {
                const r = await fetch(`/api/plugins/${ROOM_ID}/${PLUGIN_NAME}/state`);
                const data = await r.json();
                if (data.success) return data.state;
            } catch (e) {}
            return null;
        }

        async function saveQueue(newQueue) {
            if (!ROOM_ID || !PLUGIN_NAME) return;
            try {
                await fetch(`/api/plugins/${ROOM_ID}/${PLUGIN_NAME}/state`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: 'queue', value: newQueue })
                });
            } catch (e) {}
        }

        // ==================== Toast ====================

        function showToast(item) {
            if (knownIds.has(item.id)) return;
            knownIds.add(item.id);
            const el = document.createElement('div');
            el.className = 'toast';
            const triggerMap = { '主播': '', '盲盒': '盲盒续杯', '免费': '免费次数' };
            const triggerText = triggerMap[item.trigger] || '';
            el.innerHTML = `
                <div class="toast-card">
                    <div class="toast-top">
                        <span class="toast-icon">🎵</span>
                        <span class="toast-user">${esc(item.user)}</span>
                        <span class="toast-label">点了一首</span>
                    </div>
                    <div class="toast-song">${esc(item.song)}</div>
                    ${triggerText ? `<div class="toast-trigger">${triggerText}</div>` : ''}
                </div>`;
            $toastWrap.appendChild(el);
            requestAnimationFrame(() => el.classList.add('show'));
            setTimeout(() => {
                el.classList.remove('show');
                el.classList.add('hide');
                setTimeout(() => el.remove(), 500);
            }, TOAST_DURATION);
        }

        // ==================== Render ====================

        function renderQueue() {
            const removedSet = new Set(removedIds);
            const MAX_VISIBLE = 3;
            const hasFading = fadingIds.size > 0;

            // 活动队列（未删除的）
            const active = queue.filter(q => !removedSet.has(q.id));
            // 渲染列表：fade-out 期间 4 条，否则 3 条
            const take = hasFading ? MAX_VISIBLE + 1 : MAX_VISIBLE;
            const renderList = active.slice(0, take);

            // fade-out 的那条如果没在 renderList 里，插到队头
            fadingIds.forEach(id => {
                const item = queue.find(q => q.id === id);
                if (item && !renderList.some(v => v.id === id)) {
                    renderList.unshift(item);
                }
            });

            // queue-more
            const totalActive = active.length;
            if (totalActive > MAX_VISIBLE) {
                $more.textContent = `...还有 ${totalActive - MAX_VISIBLE} 首待播`;
                $more.style.display = '';
            } else {
                $more.style.display = 'none';
            }

            if (renderList.length === 0) {
                // 空队列：把所有 queue-item 移走，显示 empty
                $list.querySelectorAll('.queue-item').forEach(el => el.style.top = '1000px');
                if ($empty.parentNode !== $list) $list.appendChild($empty);
                $empty.style.top = '0px';
                return;
            }

            // 防重复：id 序列完全一样 → 只更新类和 top（top 的变化会被 CSS 过渡动画化）
            const existingEls = [...$list.querySelectorAll('.queue-item')];
            const existingIds = existingEls.map(el => parseInt(el.dataset.id));
            const newIds = renderList.map(q => q.id);

            if (existingIds.length === newIds.length && existingIds.every((id, i) => id === newIds[i])) {
                existingEls.forEach((el, i) => {
                    const item = renderList[i];
                    const fading = fadingIds.has(item.id);
                    const activeTop = active.findIndex(q => q.id === item.id);
                    const isFirst = !fading && activeTop === 0;
                    // 更新 top（CSS transition 自动动画到新位置）
                    el.style.top = (i * ROW_STEP) + 'px';
                    el.classList.toggle('fade-out', fading);
                    el.classList.toggle('current', !!isFirst);
                });
                // 移走 empty
                if ($empty.parentNode) $empty.parentNode.removeChild($empty);
                return;
            }

            // 重建 DOM
            $list.innerHTML = '';
            const frag = document.createDocumentFragment();
            renderList.forEach((item, i) => {
                const fading = fadingIds.has(item.id);
                const activeTop = active.findIndex(q => q.id === item.id);
                const isFirst = !fading && activeTop === 0;
                const num = isFirst ? '▶' : (fading ? '' : activeTop);
                const cls = ['queue-item'];
                if (isFirst) cls.push('current');
                if (fading) cls.push('fade-out', 'show');

                const el = document.createElement('div');
                el.className = cls.join(' ');
                el.dataset.id = item.id;
                el.style.top = (i * ROW_STEP) + 'px';
                el.innerHTML = `
                    <div class="q-num">${num}</div>
                    <div class="q-song">${esc(item.song)}</div>
                    <div class="q-user">${esc(item.user)}</div>`;
                frag.appendChild(el);
            });
            $list.appendChild(frag);

            // 非 fade-out 条目：下一帧加 show 触发展开动画
            requestAnimationFrame(() => {
                $list.querySelectorAll('.queue-item:not(.fade-out)').forEach(el => {
                    el.classList.add('show');
                });
            });
        }

        // ==================== 控制 ====================

        const FADE_MS = 350;
        let removedIds = [];
        let lastRemoteQueue = [];

        async function doNext() {
            if (queue.length === 0) return;
            const firstVisible = queue.find(q => !removedIds.includes(q.id));
            if (!firstVisible) return;

            fadingIds.add(firstVisible.id);
            renderQueue();

            setTimeout(async () => {
                fadingIds.delete(firstVisible.id);
                const idx = queue.findIndex(q => q.id === firstVisible.id);
                if (idx >= 0) queue.splice(idx, 1);
                removedIds.push(firstVisible.id);
                knownIds.add(firstVisible.id);
                renderQueue();
                await _saveAll();
            }, FADE_MS + 10);
        }

        async function doUndo() {
            if (removedIds.length === 0) return;
            const id = removedIds.pop();
            const restored = lastRemoteQueue.find(q => q.id === id);
            if (restored && !queue.some(q => q.id === id)) {
                queue.unshift(restored);
            }
            knownIds.add(id);
            renderQueue();
            await _saveAll();
        }

        async function _saveAll() {
            if (!ROOM_ID || !PLUGIN_NAME) return;
            try {
                await fetch(`/api/plugins/${ROOM_ID}/${PLUGIN_NAME}/state`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        key: 'queue_view',
                        value: removedIds
                    })
                });
            } catch (e) {}
        }

        // ==================== 轮询 ====================

        async function poll() {
            try {
                const state = await fetchState();
                if (!state) return;

                const remoteQueue = Array.isArray(state.queue) ? state.queue : [];
                lastRemoteQueue = remoteQueue;
                const remoteRemoved = Array.isArray(state.queue_view) ? state.queue_view : [];

                const remoteIds = new Set(remoteQueue.map(q => q.id));
                const myRemoved = new Set(removedIds);

                let changed = false;
                const myVisibleIds = new Set(queue.map(q => q.id));
                for (const item of remoteQueue) {
                    if (!myVisibleIds.has(item.id) && !myRemoved.has(item.id)) {
                        queue.push(item);
                        changed = true;
                    }
                }

                const beforeLen = queue.length;
                queue = queue.filter(q => remoteIds.has(q.id));
                if (queue.length !== beforeLen) changed = true;

                removedIds = [...new Set([...remoteRemoved, ...removedIds])];

                const removedSet = new Set(removedIds);
                for (const item of remoteQueue) {
                    if (!removedSet.has(item.id) && !knownIds.has(item.id)) {
                        showToast(item);
                    }
                }
                knownIds = new Set(remoteQueue.filter(q => !removedSet.has(q.id)).map(q => q.id));

                if (changed) renderQueue();
            } catch (e) {
                console.error('[点歌队列] 轮询失败:', e);
            }
        }

        async function init() {
            if (!ROOM_ID) {
                $empty.textContent = '错误: 缺少房间ID';
                return;
            }
            if (!PLUGIN_NAME) {
                $empty.textContent = '错误: 缺少插件名';
                return;
            }

            const state = await fetchState();
            const remoteQueue = (state && Array.isArray(state.queue)) ? state.queue : [];
            const remoteRemoved = (state && Array.isArray(state.queue_view)) ? state.queue_view : [];

            removedIds = [...remoteRemoved];
            const removedSet = new Set(removedIds);
            queue = remoteQueue.filter(q => !removedSet.has(q.id));
            knownIds = new Set(queue.map(q => q.id));
            renderQueue();

            document.addEventListener('keydown', e => {
                const tag = (e.target && e.target.tagName || '').toLowerCase();
                if (tag === 'input' || tag === 'textarea') return;
                if (e.key === ']' && !e.ctrlKey) { e.preventDefault(); doNext(); }
                else if (e.key === '[' && !e.ctrlKey) { e.preventDefault(); doUndo(); }
            });

            setInterval(poll, POLL);
        }

        init();
    </script>
</body>
</html>
