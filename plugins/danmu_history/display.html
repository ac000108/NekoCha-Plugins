<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>弹幕历史</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            background: transparent !important;
            height: 100%;
            overflow: hidden !important;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            color: #fff;
        }

        .history-stage {
            height: 100%;
            overflow-y: hidden;
            overflow-x: hidden;
            padding: 8px 6px 40px 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .danmu-item {
            padding: 3px 8px 3px 6px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            white-space: normal;
            word-break: break-all;
            box-sizing: border-box;
            cursor: pointer;
            transition: opacity 0.2s, filter 0.2s;
            user-select: none;
        }

        .danmu-item.read {
            opacity: 0.35;
            filter: grayscale(0.6);
        }
        .danmu-item.read.hide {
            display: none;
        }

        .collapse-summary {
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 12px;
            background: rgba(22, 22, 30, 0.5);
            color: rgba(255,255,255,0.35);
            cursor: pointer;
            text-align: center;
            letter-spacing: 1px;
            transition: color 0.2s, background 0.2s;
            user-select: none;
        }
        .collapse-summary:hover {
            color: rgba(255,255,255,0.6);
            background: rgba(40,40,55,0.7);
        }

        .danmu-item .time {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            margin-right: 4px;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        .danmu-item .identity {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            white-space: nowrap;
            flex-shrink: 0;
            margin-right: 4px;
            font-weight: 600;
        }

        .danmu-item .avatar {
            width: 16px; height: 16px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.4);
        }

        .danmu-item .uname {
            white-space: nowrap;
        }

        .danmu-item .gift-icon,
        .danmu-item .emoji,
        .danmu-item .inline-emot {
            height: 1.2em;
            width: auto;
            max-width: 28px;
            vertical-align: middle;
            display: inline-block;
            object-fit: contain;
        }

        .danmu-item .sc-price {
            font-size: 11px;
            padding: 0 4px;
            border-radius: 6px;
            background: rgba(255,255,255,0.2);
            font-weight: 700;
        }

        .bg-dark   { background: rgba(22, 22, 30, 0.72); }
        .bg-purple { background: rgba(80, 45, 150, 0.72); border: 1px solid rgba(160,120,255,0.25); }

        .uname-rank-gray   { color: #b0b0b8; }
        .uname-rank-blue   { color: #6fb6ff; }
        .uname-rank-purple { color: #c79bff; }
        .uname-rank-gold   { color: #ffd86b; }

        /* ===== 悬浮控件 ===== */
        .floating-controls {
            position: fixed;
            bottom: 8px; left: 0; right: 0;
            display: flex;
            justify-content: center;
            gap: 10px;
            pointer-events: none;
            z-index: 100;
        }

        .unread-badge {
            background: rgba(22, 22, 30, 0.9);
            border: 1px solid rgba(80, 170, 255, 0.6);
            color: #8ac7ff;
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            pointer-events: auto;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.25s, transform 0.25s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .unread-badge.show {
            opacity: 1;
            transform: translateY(0);
        }
        .unread-badge:hover {
            background: rgba(40, 40, 55, 0.95);
        }

        .mark-all-btn {
            background: rgba(22, 22, 30, 0.75);
            border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.6);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
            pointer-events: auto;
            transition: color 0.2s, background 0.2s;
        }
        .mark-all-btn:hover {
            color: rgba(255,255,255,0.9);
            background: rgba(40,40,55,0.9);
        }
        .mark-all-btn.hidden { display: none; }

        .empty-tip {
            text-align: center;
            color: rgba(255,255,255,0.3);
            font-size: 13px;
            padding: 40px 0;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="history-stage" id="stage">
        <div class="empty-tip" id="emptyTip">等待消息…</div>
    </div>
    <div class="floating-controls">
        <button class="unread-badge" id="unreadBadge">↑ 0 条新消息</button>
        <button class="mark-all-btn" id="markAllBtn">全部已读</button>
    </div>

    <script>
        (function() {
            const _parts = location.pathname.split('/').filter(Boolean);
            const ROOM_ID = _parts[1] || null;
            const PLUGIN_NAME = _parts[3] || null;

            const stage = document.getElementById('stage');
            const emptyTip = document.getElementById('emptyTip');
            const unreadBadge = document.getElementById('unreadBadge');
            const markAllBtn = document.getElementById('markAllBtn');

            let CFG = {
                types: { '弹幕': true, '礼物': true, '醒目留言': true, '舰长': true, '互动': true },
                maxLines: 500,
            };

            let _unreadCount = 0;
            let _isAtBottom = true;
            let _firstMsg = true;
            let _dragging = false;   // 全局拖拽勾选状态

            async function loadPluginConfig() {
                try {
                    const r = await fetch(`/rooms/${ROOM_ID}/plugins/${PLUGIN_NAME}/config`);
                    if (!r.ok) return;
                    const cfg = await r.json();
                    ['弹幕','礼物','互动','舰长','醒目留言'].forEach(k => {
                        if (cfg[k] !== undefined) CFG.types[k] = !!cfg[k];
                    });
                    if (cfg.maxLines) CFG.maxLines = parseInt(cfg.maxLines) || 500;
                } catch (e) {}
            }
            loadPluginConfig();

            function checkIsAtBottom() {
                return stage.scrollTop + stage.clientHeight >= stage.scrollHeight - 50;
            }

            function updateBadge() {
                if (_unreadCount > 0) {
                    unreadBadge.textContent = `↑ ${_unreadCount} 条新消息`;
                    unreadBadge.classList.add('show');
                } else {
                    unreadBadge.classList.remove('show');
                }
            }

            unreadBadge.addEventListener('click', () => {
                _unreadCount = 0;
                updateBadge();
                stage.scrollTop = stage.scrollHeight;
            });

            markAllBtn.addEventListener('click', () => {
                document.querySelectorAll('.danmu-item:not(.read)').forEach(el => {
                    el.classList.add('read');
                });
                collapseAdjacent();
            });

            // 全局 mouseup：结束拖拽变灰
            document.addEventListener('mouseup', () => { _dragging = false; });

            // ===== 折叠/展开逻辑 =====
            /**
             * 折叠规则：连续相邻 + 都是 .read → 加 .hide 真正隐藏，插入一行摘要
             * 用 stage 直接子节点遍历，摘要和 danmu-item 平级
             */
            function collapseAdjacent() {
                // 清除所有已有的 hide 和 summary，重新计算
                stage.querySelectorAll(':scope > .danmu-item.read.hide').forEach(el => el.classList.remove('hide'));
                stage.querySelectorAll(':scope > .collapse-summary').forEach(s => s.remove());

                // 按 DOM 顺序扫描：找连续 .read.danmu-item
                let runStart = -1, runCount = 0;
                for (let i = 0; i < stage.children.length; i++) {
                    const child = stage.children[i];
                    if (child.classList.contains('danmu-item') && child.classList.contains('read')) {
                        if (runStart === -1) runStart = i;
                        runCount++;
                    } else {
                        // 遇到中断 → flush
                        if (runCount >= 2) _doCollapse(runStart, runCount);
                        runStart = -1; runCount = 0;
                    }
                }
                // 末尾 flush
                if (runCount >= 2) _doCollapse(runStart, runCount);
            }

            function _doCollapse(startIdx, count) {
                // startIdx 是 stage.children 里第一个连续 read 的索引
                const first = stage.children[startIdx];
                // 给这 count 个加 .hide
                for (let i = startIdx; i < startIdx + count; i++) {
                    stage.children[i].classList.add('hide');
                }
                // 在第一个被 hide 的位置插入摘要
                const summary = document.createElement('div');
                summary.className = 'collapse-summary';
                summary.textContent = `▸ ${count} 条已读消息`;
                first.parentNode.insertBefore(summary, first);
                summary.addEventListener('click', () => expandSummary(summary));
            }

            function expandSummary(summary) {
                let node = summary.nextSibling;
                while (node && node.classList && node.classList.contains('danmu-item') && node.classList.contains('hide')) {
                    node.classList.remove('hide');
                    node = node.nextSibling;
                }
                summary.remove();
            }

            /**
             * 折叠指定元素所在的连续已读块（定点折叠，不影响其他块）
             */
            function collapseRunContaining(target) {
                // 先找到 target 对应的"可见块边界"——跳过已 hide 的和 summary
                // 简化：先把所有 hide 还原，所有 summary 清掉，然后只折 target 周围
                stage.querySelectorAll(':scope > .danmu-item.read.hide').forEach(el => el.classList.remove('hide'));
                stage.querySelectorAll(':scope > .collapse-summary').forEach(s => s.remove());

                // 找 target 在 stage.children 里的索引
                const children = Array.from(stage.children);
                const idx = children.indexOf(target);
                if (idx === -1) return;

                // 向左扩展：连续 .danmu-item.read
                let left = idx;
                while (left > 0 && stage.children[left-1].classList.contains('danmu-item') && stage.children[left-1].classList.contains('read')) {
                    left--;
                }
                // 向右扩展
                let right = idx;
                while (right < stage.children.length - 1 && stage.children[right+1].classList.contains('danmu-item') && stage.children[right+1].classList.contains('read')) {
                    right++;
                }

                const count = right - left + 1;
                if (count < 2) return;   // 至少 2 条才折

                const first = stage.children[left];
                for (let i = left; i <= right; i++) {
                    stage.children[i].classList.add('hide');
                }
                const summary = document.createElement('div');
                summary.className = 'collapse-summary';
                summary.textContent = `▸ ${count} 条已读消息`;
                first.parentNode.insertBefore(summary, first);
                summary.addEventListener('click', () => expandSummary(summary));
            }

            // ===== 消息渲染 =====
            function rankClass(msg) {
                const lv = msg['舰长等级'] || '';
                if (lv === '总督') return 'uname-rank-gold';
                if (lv === '提督') return 'uname-rank-purple';
                if (lv === '舰长') return 'uname-rank-blue';
                return 'uname-rank-gray';
            }

            function bgClass(msg) {
                const t = msg['消息类型'];
                if (t === '礼物' || t === '醒目留言' || t === '舰长') return 'bg-purple';
                return 'bg-dark';
            }

            function timeStr() {
                const d = new Date();
                const h = String(d.getHours()).padStart(2,'0');
                const m = String(d.getMinutes()).padStart(2,'0');
                const s = String(d.getSeconds()).padStart(2,'0');
                return `${h}:${m}:${s}`;
            }

            function buildBubble(msg) {
                const t = msg['消息类型'];
                const div = document.createElement('div');
                div.className = 'danmu-item ' + bgClass(msg);
                // 给折叠逻辑用的 data 属性
                div.dataset.uname = msg['用户名'] || '';
                div.dataset.mtype = t;

                // 时间戳
                const time = document.createElement('span');
                time.className = 'time';
                time.textContent = timeStr();
                div.appendChild(time);

                // 头像 + 名字
                const avatar = msg['头像URL'];
                if (avatar) {
                    const img = document.createElement('img');
                    img.className = 'avatar';
                    img.src = avatar;
                    img.referrerPolicy = 'no-referrer';
                    img.onerror = () => img.remove();
                    div.appendChild(img);
                }
                const mark = document.createElement('span');
                mark.className = 'uname ' + rankClass(msg);
                mark.textContent = (msg['用户名'] || '') + ':';
                div.appendChild(mark);

                // 正文（同 danmu_show 的渲染逻辑）
                if (t === '礼物' && msg['礼物图片URL']) {
                    const img = document.createElement('img');
                    img.className = 'gift-icon';
                    img.src = msg['礼物图片URL'];
                    img.referrerPolicy = 'no-referrer';
                    img.onerror = () => img.remove();
                    div.appendChild(img);
                }

                if (t === '弹幕') {
                    const content = msg['弹幕内容'] || '';
                    const emojiUrl = msg['图片链接'];
                    const inlineEmots = msg['inline表情'] || {};

                    if (emojiUrl) {
                        const img = document.createElement('img');
                        img.className = 'emoji';
                        img.src = emojiUrl;
                        img.referrerPolicy = 'no-referrer';
                        img.onerror = () => img.remove();
                        div.appendChild(img);
                    } else if (content) {
                        if (Object.keys(inlineEmots).length > 0) {
                            const regex = /\[[^\]]+\]/g;
                            let lastIdx = 0, m;
                            const wholeMatch = content.match(/^\[[^\]]+\]$/);
                            if (wholeMatch && inlineEmots[wholeMatch[0]]) {
                                const img = document.createElement('img');
                                img.className = 'inline-emot';
                                img.src = inlineEmots[wholeMatch[0]];
                                img.referrerPolicy = 'no-referrer';
                                img.onerror = () => img.remove();
                                div.appendChild(img);
                            } else {
                                while ((m = regex.exec(content)) !== null) {
                                    if (m.index > lastIdx) {
                                        div.appendChild(document.createTextNode(content.slice(lastIdx, m.index)));
                                    }
                                    const emotUrl = inlineEmots[m[0]];
                                    if (emotUrl) {
                                        const img = document.createElement('img');
                                        img.className = 'inline-emot';
                                        img.src = emotUrl;
                                        img.referrerPolicy = 'no-referrer';
                                        img.onerror = () => img.remove();
                                        div.appendChild(img);
                                    } else {
                                        div.appendChild(document.createTextNode(m[0]));
                                    }
                                    lastIdx = regex.lastIndex;
                                }
                                if (lastIdx < content.length) {
                                    div.appendChild(document.createTextNode(content.slice(lastIdx)));
                                }
                            }
                        } else {
                            div.appendChild(document.createTextNode(content));
                        }
                    }
                } else if (t === '礼物') {
                    const name = msg['礼物名称'] || '礼物';
                    const num = msg['礼物数量'] || 1;
                    const totalCoin = msg['总价值'] || 0;
                    const cny = (totalCoin / 1000).toFixed(2);
                    let txt = `${name} ×${num}`;
                    if (totalCoin > 0) txt += `  CNY ${cny}`;
                    div.appendChild(document.createTextNode(txt));
                } else if (t === '互动') {
                    div.appendChild(document.createTextNode(msg['动作'] || ''));
                } else if (t === '舰长') {
                    div.appendChild(document.createTextNode(`开通${msg['开通数量'] || 1} ${msg['舰长等级'] || '舰长'}`));
                } else if (t === '醒目留言') {
                    const price = msg['价格'];
                    if (price) {
                        const p = document.createElement('span');
                        p.className = 'sc-price';
                        p.textContent = '¥' + (price / 10).toFixed(1);
                        div.appendChild(p);
                    }
                    div.appendChild(document.createTextNode(' ' + (msg['留言内容'] || '')));
                }

                // 拖拽变灰
                div.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    _dragging = true;
                    div.classList.add('read');
                });
                div.addEventListener('mouseenter', () => {
                    if (_dragging) div.classList.add('read');
                });
                // 单击灰色条目 → 折叠它所在的连续已读块
                div.addEventListener('click', () => {
                    if (!_dragging && div.classList.contains('read')) {
                        collapseRunContaining(div);
                    }
                });

                return div;
            }

            function pushBubble(msg) {
                if (!ROOM_ID) return;
                const t = msg['消息类型'];
                if (!CFG.types[t]) return;

                if (_firstMsg) {
                    _firstMsg = false;
                    emptyTip.remove();
                }

                const wasAtBottom = _isAtBottom;

                // 如果有折叠组在底部，新消息追加到 stage 最后面（不会进折叠组）
                stage.appendChild(buildBubble(msg));

                // FIFO 淘汰（只数 danmu-item，不数 summary）
                let count = stage.querySelectorAll(':scope > .danmu-item').length;
                if (count > CFG.maxLines) {
                    for (const child of Array.from(stage.children)) {
                        if (count <= CFG.maxLines) break;
                        if (child.classList.contains('danmu-item')) {
                            child.remove();
                            count--;
                        } else if (child.classList.contains('collapse-summary')) {
                            child.remove();   // 摘要没人对应了，顺带删
                        }
                    }
                }

                if (wasAtBottom) {
                    stage.scrollTop = stage.scrollHeight;
                    _unreadCount = 0;
                    _isAtBottom = true;
                } else {
                    _unreadCount++;
                }
                updateBadge();
            }

            function connectSSE() {
                if (!ROOM_ID) return;
                const es = new EventSource(`/api/events?plugin=${PLUGIN_NAME}&room_id=${ROOM_ID}`);
                es.onmessage = ev => {
                    try { pushBubble(JSON.parse(ev.data)); } catch (e) {}
                };
                es.onerror = () => setTimeout(connectSSE, 2000);
            }

            // ===== 手动 wheel 滚动（overflow:hidden 后原生滚动条没了）=====
            stage.addEventListener('wheel', (e) => {
                e.preventDefault();
                stage.scrollTop += e.deltaY;
                stage.scrollTop = Math.max(0, Math.min(stage.scrollTop, stage.scrollHeight - stage.clientHeight));
                _isAtBottom = checkIsAtBottom();
                if (_isAtBottom && _unreadCount > 0) {
                    _unreadCount = 0;
                    updateBadge();
                }
            }, { passive: false });

            connectSSE();
        })();
    </script>
</body>
</html>
