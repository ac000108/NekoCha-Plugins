<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>弹幕覆盖层</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            background: transparent !important;
            overflow: hidden;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        .chat-stage {
            position: absolute;
            left: 0; right: 0;
            bottom: 0;
            overflow: hidden;
            padding: 0 8px 8px 8px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 6px;
            pointer-events: none;
        }

        .danmu-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px 4px 6px;
            border-radius: 16px;
            white-space: normal;
            word-break: break-all;
            overflow: hidden;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            text-shadow: 0 1px 2px rgba(0,0,0,0.55);
            max-width: 100%;
            max-height: 2.4em;
            line-height: 1.2;
            box-sizing: border-box;
            animation: bubbleIn 0.25s ease-out;
            border: 1px solid rgba(255,255,255,0.08);
        }

        @keyframes bubbleIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .danmu-item .avatar {
            width: 20px; height: 20px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid rgba(255,255,255,0.5);
            flex-shrink: 0;
        }

        .danmu-item .gift-icon {
            width: 28px; height: 28px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .danmu-item .emoji {
            height: 24px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .danmu-item .sc-price {
            font-size: 13px;
            padding: 1px 6px;
            border-radius: 8px;
            background: rgba(255,255,255,0.2);
            font-weight: 700;
        }

        /* ===== 背景两类 ===== */
        /* 深色：文字弹幕 / 表情弹幕 / 互动 */
        .bg-dark  { background: rgba(22, 22, 30, 0.62); }
        /* 紫色：礼物 / SC / 开通舰长 */
        .bg-purple { background: rgba(80, 45, 150, 0.65); border: 1px solid rgba(160,120,255,0.25); }

        /* ===== 名字颜色（按舰长等级分四档身份）===== */
        /* 灰色 = 普通观众（无舰长等级，含粉丝牌用户）*/
        .uname-rank-gray   { color: #b0b0b8; }
        /* 蓝色 = 舰长 */
        .uname-rank-blue   { color: #6fb6ff; }
        /* 紫色 = 提督 */
        .uname-rank-purple { color: #c79bff; }
        /* 金色 = 总督 */
        .uname-rank-gold   { color: #ffd86b; }

        .tip {
            position: absolute;
            left: 50%; bottom: 24px;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.35);
            font-size: 14px;
            letter-spacing: 2px;
            transition: opacity 0.6s;
        }
        .tip.hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div class="chat-stage" id="stage"></div>
    <div class="tip" id="tip">等待消息…</div>

    <script>
        (function() {
            const _parts = location.pathname.split('/').filter(Boolean);
            const ROOM_ID = _parts[1] || null;
            const PLUGIN_NAME = _parts[3] || null;

            let CFG = {
                types: { '弹幕': true, '礼物': true, '醒目留言': true, '舰长': true, '互动': false },
                maxLines: 30,
            };

            async function loadPluginConfig() {
                try {
                    const r = await fetch(`/rooms/${ROOM_ID}/plugins/${PLUGIN_NAME}/config`);
                    if (!r.ok) return;
                    const cfg = await r.json();
                    ['弹幕','礼物','互动','舰长','醒目留言'].forEach(k => {
                        if (cfg[k] !== undefined) CFG.types[k] = !!cfg[k];
                    });
                } catch (e) {}
            }
            loadPluginConfig();

            let _tipHidden = false;

            /**
             * 判断身份等级 → 名字颜色
             * 依赖 message_parser 产出的 '舰长等级' 字段: '' / '舰长' / '提督' / '总督'
             */
            function rankClass(msg) {
                const lv = msg['舰长等级'] || '';
                if (lv === '总督') return 'uname-rank-gold';
                if (lv === '提督') return 'uname-rank-purple';
                if (lv === '舰长') return 'uname-rank-blue';
                return 'uname-rank-gray';   // 空 = 普通观众（含粉丝牌）
            }

            /**
             * 判断背景类别
             * 紫色: 礼物 / SC / 开通舰长
             * 深色: 文字弹幕 / 表情弹幕 / 互动
             */
            function bgClass(msg) {
                const t = msg['消息类型'];
                if (t === '礼物' || t === '醒目留言' || t === '舰长') return 'bg-purple';
                return 'bg-dark';
            }

            function buildBubble(msg) {
                const t = msg['消息类型'];
                const div = document.createElement('div');
                div.className = 'danmu-item ' + bgClass(msg);

                // 1. 头像
                const avatar = msg['头像URL'];
                if (avatar) {
                    const img = document.createElement('img');
                    img.className = 'avatar';
                    img.src = avatar;
                    img.referrerPolicy = 'no-referrer';
                    img.onerror = () => img.remove();
                    div.appendChild(img);
                }

                // 2. 用户名（颜色按身份）
                const mark = document.createElement('span');
                mark.className = rankClass(msg);
                mark.textContent = (msg['用户名'] || '') + ':';
                div.appendChild(mark);

                // 3. 礼物图标（放在用户名后，正文前）
                if (t === '礼物' && msg['礼物图片URL']) {
                    const img = document.createElement('img');
                    img.className = 'gift-icon';
                    img.src = msg['礼物图片URL'];
                    img.referrerPolicy = 'no-referrer';
                    img.onerror = () => img.remove();
                    div.appendChild(img);
                }

                // 4. 正文
                if (t === '弹幕') {
                    const content = msg['弹幕内容'] || '';
                    const emojiUrl = msg['图片链接'];
                    if (content) div.appendChild(document.createTextNode(' ' + content));
                    if (emojiUrl) {
                        const img = document.createElement('img');
                        img.className = 'emoji';
                        img.src = emojiUrl;
                        img.referrerPolicy = 'no-referrer';
                        img.onerror = () => img.remove();
                        div.appendChild(img);
                    }
                } else if (t === '礼物') {
                    div.appendChild(document.createTextNode(` ${msg['礼物名称'] || '礼物'} ×${msg['礼物数量'] || 1}`));
                } else if (t === '互动') {
                    div.appendChild(document.createTextNode(' ' + (msg['动作'] || '')));
                } else if (t === '舰长') {
                    div.appendChild(document.createTextNode(` 开通${msg['开通数量'] || 1} ${msg['舰长等级'] || '舰长'}`));
                } else if (t === '醒目留言') {
                    const price = msg['价格'];
                    if (price) {
                        const p = document.createElement('span');
                        p.className = 'sc-price';
                        p.textContent = '¥' + (price / 10).toFixed(1);
                        div.appendChild(p);
                    }
                    div.appendChild(document.createTextNode(' ' + (msg['留言内容'] || '')));
                }

                return div;
            }

            function pushBubble(msg) {
                if (!ROOM_ID) return;
                const t = msg['消息类型'];
                if (!CFG.types[t]) return;

                if (!_tipHidden) { _tipHidden = true; document.getElementById('tip').classList.add('hidden'); }

                const stage = document.getElementById('stage');
                stage.appendChild(buildBubble(msg));

                while (stage.children.length > CFG.maxLines) {
                    stage.firstElementChild.remove();
                }
            }

            function connectSSE() {
                if (!ROOM_ID) return;
                const es = new EventSource(`/api/events?plugin=${PLUGIN_NAME}&room_id=${ROOM_ID}`);
                es.onmessage = ev => {
                    try { pushBubble(JSON.parse(ev.data)); } catch (e) {}
                };
                es.onerror = () => setTimeout(connectSSE, 2000);
            }

            connectSSE();
        })();
    </script>
</body>
</html>
