<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>弹幕覆盖层</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            background: transparent !important;
            overflow: hidden;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        .chat-stage {
            position: absolute;
            left: 0; right: 0;
            bottom: 0;
            overflow: hidden;
            padding: 0 8px 8px 8px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 6px;
            pointer-events: none;
        }

        .danmu-item {
            padding: 4px 10px 4px 6px;
            border-radius: 16px;
            white-space: normal;
            word-break: break-all;
            overflow: hidden;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            text-shadow: 0 1px 2px rgba(0,0,0,0.55);
            max-width: 100%;
            max-height: 2.4em;
            line-height: 1.2;
            box-sizing: border-box;
            animation: bubbleIn 0.25s ease-out;
            border: 1px solid rgba(255,255,255,0.08);
        }

        @keyframes bubbleIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* 头像+名字组：float 到左侧永远占第一行，不换行 */
        .danmu-item .identity {
            float: left;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            flex-shrink: 0;
            margin-right: 4px;
            line-height: 1.2;
        }

        .danmu-item .avatar {
            width: 20px; height: 20px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid rgba(255,255,255,0.5);
            flex-shrink: 0;
            vertical-align: middle;
        }

        .danmu-item .gift-icon {
            width: 28px; height: 28px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .danmu-item .emoji {
            height: 24px;
            object-fit: contain;
            flex-shrink: 0;
        }

        /* inline 小表情（普通弹幕里的 [dog] 替换图） */
        .danmu-item .inline-emot {
            height: 1.4em;
            width: auto;
            vertical-align: middle;
            display: inline-block;
            object-fit: contain;
        }

        .danmu-item .sc-price {
            font-size: 13px;
            padding: 1px 6px;
            border-radius: 8px;
            background: rgba(255,255,255,0.2);
            font-weight: 700;
        }

        /* ===== 背景两类 ===== */
        /* 深色：文字弹幕 / 表情弹幕 / 互动 */
        .bg-dark  { background: rgba(22, 22, 30, 0.62); }
        /* 紫色：礼物 / SC / 开通舰长 */
        .bg-purple { background: rgba(80, 45, 150, 0.65); border: 1px solid rgba(160,120,255,0.25); }

        .danmu-item .uname {
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* ===== 名字颜色（按舰长等级分四档身份）===== */
        /* 灰色 = 普通观众（无舰长等级，含粉丝牌用户）*/
        .uname-rank-gray   { color: #b0b0b8; }
        /* 蓝色 = 舰长 */
        .uname-rank-blue   { color: #6fb6ff; }
        /* 紫色 = 提督 */
        .uname-rank-purple { color: #c79bff; }
        /* 金色 = 总督 */
        .uname-rank-gold   { color: #ffd86b; }

        .tip {
            position: absolute;
            left: 50%; bottom: 24px;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.35);
            font-size: 14px;
            letter-spacing: 2px;
            transition: opacity 0.6s;
        }
        .tip.hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div class="chat-stage" id="stage"></div>
    <div class="tip" id="tip">等待消息…</div>

    <script>
        (function() {
            const _parts = location.pathname.split('/').filter(Boolean);
            const ROOM_ID = _parts[1] || null;
            const PLUGIN_NAME = _parts[3] || null;

            let CFG = {
                types: { '弹幕': true, '礼物': true, '醒目留言': true, '舰长': true, '互动': false },
                maxLines: 30,
            };

            async function loadPluginConfig() {
                try {
                    const r = await fetch(`/rooms/${ROOM_ID}/plugins/${PLUGIN_NAME}/config`);
                    if (!r.ok) return;
                    const cfg = await r.json();
                    ['弹幕','礼物','互动','舰长','醒目留言'].forEach(k => {
                        if (cfg[k] !== undefined) CFG.types[k] = !!cfg[k];
                    });
                } catch (e) {}
            }
            loadPluginConfig();

            let _tipHidden = false;

            /**
             * 判断身份等级 → 名字颜色
             * 依赖 message_parser 产出的 '舰长等级' 字段: '' / '舰长' / '提督' / '总督'
             */
            function rankClass(msg) {
                const lv = msg['舰长等级'] || '';
                if (lv === '总督') return 'uname-rank-gold';
                if (lv === '提督') return 'uname-rank-purple';
                if (lv === '舰长') return 'uname-rank-blue';
                return 'uname-rank-gray';   // 空 = 普通观众（含粉丝牌）
            }

            /**
             * 判断背景类别
             * 紫色: 礼物 / SC / 开通舰长
             * 深色: 文字弹幕 / 表情弹幕 / 互动
             */
            function bgClass(msg) {
                const t = msg['消息类型'];
                if (t === '礼物' || t === '醒目留言' || t === '舰长') return 'bg-purple';
                return 'bg-dark';
            }

            function buildBubble(msg) {
                const t = msg['消息类型'];
                const div = document.createElement('div');
                div.className = 'danmu-item ' + bgClass(msg);

                // ===== 头像+名字 组（float 左侧，永远不换行，独占一行左侧）=====
                const identity = document.createElement('span');
                identity.className = 'identity';

                const avatar = msg['头像URL'];
                if (avatar) {
                    const img = document.createElement('img');
                    img.className = 'avatar';
                    img.src = avatar;
                    img.referrerPolicy = 'no-referrer';
                    img.onerror = () => img.remove();
                    identity.appendChild(img);
                }

                const mark = document.createElement('span');
                mark.className = 'uname ' + rankClass(msg);
                mark.textContent = (msg['用户名'] || '') + ':';
                identity.appendChild(mark);

                div.appendChild(identity);

                // ===== 正文区（inline flow，自然折行，被 float 挤压到 identity 右侧）=====
                if (t === '礼物' && msg['礼物图片URL']) {
                    const img = document.createElement('img');
                    img.className = 'gift-icon';
                    img.src = msg['礼物图片URL'];
                    img.referrerPolicy = 'no-referrer';
                    img.onerror = () => img.remove();
                    div.appendChild(img);
                }

                if (t === '弹幕') {
                    const content = msg['弹幕内容'] || '';
                    const emojiUrl = msg['图片链接'];        // 表情弹幕（大表情 bulge_display）
                    const inlineEmots = msg['inline表情'] || {};
                    // 表情弹幕：整条就是大表情图，跳过 content
                    if (emojiUrl) {
                        const img = document.createElement('img');
                        img.className = 'emoji';
                        img.src = emojiUrl;
                        img.referrerPolicy = 'no-referrer';
                        img.onerror = () => img.remove();
                        div.appendChild(img);
                    } else if (content) {
                        // 普通弹幕：把 content 里的 [xxx] 占位符替换成 inline 表情图
                        if (Object.keys(inlineEmots).length > 0) {
                            const regex = /\[([^\]]+)\]/g;
                            let lastIdx = 0;
                            let m;
                            // 如果整条 content 只有一个 inline 表情（如 "[dog]"），只显示图
                            const wholeMatch = content.match(/^\[([^\]]+)\]$/);
                            if (wholeMatch && inlineEmots[wholeMatch[1]]) {
                                const img = document.createElement('img');
                                img.className = 'inline-emot';
                                img.src = inlineEmots[wholeMatch[1]];
                                img.referrerPolicy = 'no-referrer';
                                img.onerror = () => img.remove();
                                div.appendChild(img);
                            } else {
                                while ((m = regex.exec(content)) !== null) {
                                    // 占位符前的纯文字
                                    if (m.index > lastIdx) {
                                        div.appendChild(document.createTextNode(
                                            ' ' + content.slice(lastIdx, m.index)
                                        ));
                                    }
                                    // 替换成表情图（如果有）
                                    const emotUrl = inlineEmots[m[1]];
                                    if (emotUrl) {
                                        const img = document.createElement('img');
                                        img.className = 'inline-emot';
                                        img.src = emotUrl;
                                        img.referrerPolicy = 'no-referrer';
                                        img.onerror = () => img.remove();
                                        div.appendChild(img);
                                    } else {
                                        div.appendChild(document.createTextNode(m[0]));
                                    }
                                    lastIdx = regex.lastIndex;
                                }
                                // 末尾剩余文字
                                if (lastIdx < content.length) {
                                    div.appendChild(document.createTextNode(
                                        ' ' + content.slice(lastIdx)
                                    ));
                                }
                            }
                        } else {
                            div.appendChild(document.createTextNode(' ' + content));
                        }
                    }
                } else if (t === '礼物') {
                    const name = msg['礼物名称'] || '礼物';
                    const num = msg['礼物数量'] || 1;
                    const totalCoin = msg['总价值'] || 0;
                    const cny = (totalCoin / 10).toFixed(1);   // B站 10金瓜子=1元
                    let txt = ` ${name} ×${num}`;
                    if (totalCoin > 0) txt += `  CNY ${cny}`;
                    div.appendChild(document.createTextNode(txt));
                } else if (t === '互动') {
                    div.appendChild(document.createTextNode(' ' + (msg['动作'] || '')));
                } else if (t === '舰长') {
                    div.appendChild(document.createTextNode(` 开通${msg['开通数量'] || 1} ${msg['舰长等级'] || '舰长'}`));
                } else if (t === '醒目留言') {
                    const price = msg['价格'];
                    if (price) {
                        const p = document.createElement('span');
                        p.className = 'sc-price';
                        p.textContent = '¥' + (price / 10).toFixed(1);
                        div.appendChild(p);
                    }
                    div.appendChild(document.createTextNode(' ' + (msg['留言内容'] || '')));
                }

                return div;
            }

            function pushBubble(msg) {
                if (!ROOM_ID) return;
                const t = msg['消息类型'];
                if (!CFG.types[t]) return;

                if (!_tipHidden) { _tipHidden = true; document.getElementById('tip').classList.add('hidden'); }

                const stage = document.getElementById('stage');
                stage.appendChild(buildBubble(msg));

                while (stage.children.length > CFG.maxLines) {
                    stage.firstElementChild.remove();
                }
            }

            function connectSSE() {
                if (!ROOM_ID) return;
                const es = new EventSource(`/api/events?plugin=${PLUGIN_NAME}&room_id=${ROOM_ID}`);
                es.onmessage = ev => {
                    try { pushBubble(JSON.parse(ev.data)); } catch (e) {}
                };
                es.onerror = () => setTimeout(connectSSE, 2000);
            }

            connectSSE();
        })();
    </script>
</body>
</html>
