<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>示例插件</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: transparent;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }
        .message-item {
            padding: 5px 10px;
            margin: 3px 0;
            background: rgba(15, 52, 96, 0.5);
            border-radius: 4px;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div class="message-list" id="messageList"></div>

    <script>
        const _parts = window.location.pathname.split('/').filter(Boolean);
        const ROOM_ID = _parts[1] || null;
        const PLUGIN_NAME = _parts[3] || null;
        const MAX_MESSAGES = 100;
        let config = null;

        async function loadConfig() {
            if (!ROOM_ID) return;
            try {
                const resp = await fetch(`/rooms/${ROOM_ID}/plugins`);
                const data = await resp.json();
                if (data.success && data.data) {
                    const pluginData = data.data.find(p => p.name === PLUGIN_NAME);
                    if (pluginData) {
                        config = pluginData.config;
                    }
                }
            } catch (e) {}
        }

        function shouldShowMessage(msg) {
            if (!config) return true;
            const type = msg.消息类型;
            if (type === '弹幕' && config.弹幕) return true;
            if (type === '互动' && config.互动) return true;
            if (type === '礼物' && config.礼物) return true;
            if (type === '舰长' && config.舰长) return true;
            return false;
        }

        function formatMessage(msg) {
            const type = msg.消息类型;
            let content = '';

            if (type === '弹幕') {
                content = msg.弹幕内容 || '';
            } else if (type === '礼物') {
                content = (msg.礼物名称 || '礼物') + ' x' + (msg.礼物数量 || 1);
            } else if (type === '互动') {
                content = msg.动作 || '';
            } else if (type === '舰长') {
                content = '开通' + (msg.舰长等级 || '舰长') + ' x' + (msg.开通数量 || 1);
            }

            return `[${type}] ${msg.用户名 || '未知'}: ${content}`;
        }

        function addMessage(msg) {
            const item = document.createElement('div');
            item.className = 'message-item';
            item.textContent = formatMessage(msg);

            const list = document.getElementById('messageList');
            list.insertBefore(item, list.firstChild);

            while (list.children.length > MAX_MESSAGES) {
                list.removeChild(list.lastChild);
            }
        }

        function connectSSE() {
            if (!ROOM_ID) return;
            const url = `/api/events?plugin=${PLUGIN_NAME}&room_id=${ROOM_ID}`;
            const eventSource = new EventSource(url);

            eventSource.onmessage = function(event) {
                try {
                    const msg = JSON.parse(event.data);
                    if (shouldShowMessage(msg)) {
                        addMessage(msg);
                    }
                } catch (e) {}
            };

            eventSource.onerror = function() {
                setTimeout(connectSSE, 3000);
            };
        }

        loadConfig();
        connectSSE();
    </script>
</body>
</html>
